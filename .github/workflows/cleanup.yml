name: Cleanup All Artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Setiap hari jam 00:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '0 days'
          skip-recent: 0
