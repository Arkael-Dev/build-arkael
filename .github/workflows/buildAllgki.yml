name: Release Build - All GKI (FIXED v3)

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Mode'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'

      GOVERNOR_CHOICE:
        description: '🎛️ Governor'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'

      VORTEX_GKI_FILE:
        description: '📁 Vortex GKI File'
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ============================================
  # JOB 1: VALIDATE & PREPARE (No Matrix Generation!)
  # ============================================
  prepare:
    name: "🔍 Validate Inputs"
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.validate.outputs.release_type }}
      governor_choice: ${{ steps.validate.outputs.governor_choice }}
      selected_variants: ${{ steps.validate.outputs.selected_variants }}
      
    steps:
      - name: ✅ Validate Configuration
        id: validate
        run: |
          echo "=========================================="
          echo "  🔍 INPUT VALIDATION"
          echo "=========================================="
          
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          
          echo "Release Type : ${RT}"
          echo "Governor     : ${GC}"
          
          # Validate release type
          case "${RT}" in
            full|ksu|no|sukisu) 
              echo "✅ Release Type Valid" 
              ;;
            *) 
              echo "❌ Invalid Release Type"
              exit 1 
              ;;
          esac
          
          # Validate governor
          case "${GC}" in
            vortexcore|arkael|all) 
              echo "✅ Governor Valid" 
              ;;
            *) 
              echo "❌ Invalid Governor"
              exit 1 
              ;;
          esac
          
          # Output validated values
          echo "release_type=${RT}" >> $GITHUB_OUTPUT
          echo "governor_choice=${GC}" >> $GITHUB_OUTPUT
          
          # Output human-readable summary
          case "${RT}" in
            full)   echo "selected_variants=All (VNL, KSU, KSU+SuSFS, SukiSU)" >> $GITHUB_OUTPUT ;;
            ksu)    echo "selected_variants=KSU, KSU+SuSFS, SukiSU" >> $GITHUB_OUTPUT ;;
            no)     echo "selected_variants=VNL Only" >> $GITHUB_OUTPUT ;;
            sukisu) echo "selected_variants=SukiSU Only" >> $GITHUB_OUTPUT ;;
          esac
          
          echo ""
          echo "=========================================="
          echo "  ✅ VALIDATION PASSED"
          echo "=========================================="

  # ============================================
  # JOB 2: BUILD MATRIX (Hardcoded + Real Filtering)
  # ============================================
  build:
    name: "🐧 ${{ matrix.kernel_version }} | ${{ matrix.variant_name }} | ${{ matrix.governor }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== GKI 5.10 =====
          - { kernel_version: "5.10", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","no"] }
          - { kernel_version: "5.10", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","no"] }
          - { kernel_version: "5.10", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "5.10", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "5.10", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "5.10", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "5.10", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu","sukisu"] }
          - { kernel_version: "5.10", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu","sukisu"] }

          # ===== GKI 6.1 =====
          - { kernel_version: "6.1", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","no"] }
          - { kernel_version: "6.1", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","no"] }
          - { kernel_version: "6.1", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.1", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.1", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.1", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.1", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu","sukisu"] }
          - { kernel_version: "6.1", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu","sukisu"] }

          # ===== GKI 6.6 =====
          - { kernel_version: "6.6", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","no"] }
          - { kernel_version: "6.6", variant_name: "VNL", ksu: "no", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","no"] }
          - { kernel_version: "6.6", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.6", variant_name: "KSU", ksu: "yes", ksu_susfs: "false", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.6", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.6", variant_name: "KSU+SuSFS", ksu: "yes", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu"] }
          - { kernel_version: "6.6", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "vortexcore", enabled_for: ["full","ksu","sukisu"], is_last: true }
          - { kernel_version: "6.6", variant_name: "SukiSU", ksu: "sukisu", ksu_susfs: "true", governor: "arkael", enabled_for: ["full","ksu","sukisu"], is_last: true }
    
    steps:
      # ==========================================
      # STEP 1: REAL FILTER CHECK (No Fake Success!)
      # ==========================================
      - name: 🔍 Check If Should Build
        id: check
        run: |
          RT="${{ needs.prepare.outputs.release_type }}"
          ENABLED_FOR='${{ join(matrix.enabled_for, ',') }}'
          
          # Check if current release_type is in enabled_for list
          if echo "${ENABLED_FOR}" | grep -q "\\b${RT}\\b"; then
            echo "✅ ENABLED: This build matches release type '${RT}'"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️  SKIPPED: This build NOT enabled for '${RT}' (enabled for: ${ENABLED_FOR})"
            echo "should_build=false" >> $GITHUB_OUTPUT
            # Exit early to prevent fake success
            exit 0
          fi

      - name: 📥 Checkout Repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Initialize Build Environment
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "STATUS=RELEASE" >> $GITHUB_ENV
          echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          echo "=========================================="
          echo "  🚀 ARKAEL KERNEL BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel   : ${{ matrix.kernel_version }}"
          echo "  Variant  : ${{ matrix.variant_name }}"
          echo "  Governor : ${{ matrix.governor }}"
          echo "  KSU      : ${{ matrix.ksu }}"
          echo "  SuSFS    : ${{ matrix.ksu_susfs }}"
          echo "=========================================="

      - name: 📦 Install Dependencies
        if: steps.check.outputs.should_build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq
          pip install lxml -qq

      - name: ⚙️ Execute Build Script
        if: steps.check.outputs.should_build == 'true'
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          LAST_BUILD: ${{ matrix.is_last == true && 'true' || 'false' }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
          GOVERNOR_CHOICE: ${{ matrix.governor }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "▶️ BUILD: ${{ matrix.variant_name }} (${{ matrix.kernel_version }}) [Gov: ${{ matrix.governor }}]"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          ./build.sh
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          # Verify artifacts exist
          if [ ! -d "artifacts" ] || [ -z "$(ls -A artifacts/*.zip 2>/dev/null)" ]; then
            echo "⚠️ WARNING: No ZIP artifacts found after build!"
            exit 1
          fi
          
          echo "✅ Build OK!"

      - name: 📤 Upload Artifacts
        if: always() && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ matrix.governor }}"
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          if-no-files-found: error  # ❌ CHANGE: Error instead of warn!

  # ============================================
  # JOB 3: UNIFIED RELEASE
  # ============================================
  release:
    name: "🚀 Create Unified Release"
    permissions:
      contents: write
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: 🔍 Inspect Artifacts
        run: |
          echo "=========================================="
          echo "  🔍 ARTIFACT INSPECTION"
          echo "=========================================="
          
          # Flatten structure if needed
          if find release_files -mindepth 2 -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | grep -q .; then
            mkdir -p release_flat
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) -exec cp {} release_flat/ \;
            rm -rf release_files
            mv release_flat release_files
          fi
          
          echo ""
          echo "📦 Files found:"
          ls -lh release_files/ 2>/dev/null || echo "  ⚠️ EMPTY!"
          
          TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo ""
          echo "📊 Total: ${TOTAL} files"
          echo "total_files=${TOTAL}" >> $GITHUB_ENV
          
          if [ "${TOTAL}" -eq 0 ]; then
            echo "❌ ERROR: No artifacts to release!"
            exit 1
          fi

      - name: 🔍 Extract Build Info
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=Arkael-Kernel" >> $GITHUB_ENV
            echo "RELEASE=v0.3" >> $GITHUB_ENV
          fi

      - name: 🏷️ Generate Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          RT="${{ needs.prepare.outputs.release_type }}"
          GC="${{ needs.prepare.outputs.governor_choice }}"
          KN="${KERNEL_NAME:-Arkael-Kernel}"
          RELEASE_TAG="${KN}-AllGKI-${RT}-${GC}-${TIMESTAMP}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: 📝 Prepare Notes
        run: |
          cat > release_notes.md << EOF
          ## 🐧 Arkael Kernel - All GKI Release
          
          ### 📋 Build Information
          | Item | Details |
          |------|---------|
          | **Kernel Name** | ${KERNEL_NAME:-Arkael-Kernel} |
          | **Build Date** | ${BUILD_TIMESTAMP} |
          | **Release Type** | ${{ needs.prepare.outputs.release_type }} |
          | **Governor** | ${{ needs.prepare.outputs.governor_choice }} |
          
          ### 📦 Contents (${total_files} files)
          
          This release contains **${{ needs.prepare.outputs.selected_variants }}** variants.
          
          ---
          *Built by Kingfinik98*
          EOF

      - name: 🚀 Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="Kingfinik98/build-arkael"
          
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 Arkael Kernel - All GKI (${BUILD_TIMESTAMP})" \
            --notes-file release_notes.md || true
          
          COUNT=0
          while IFS= read -r f; do
            gh release upload "${RELEASE_TAG}" --repo "${REPO}" "${f}" --clobber 2>/dev/null && ((COUNT++))
          done < <(find release_files -type f \( -name "*.zip" -o -name "*.img" \))
          
          echo "✅ Uploaded ${COUNT} files"
          echo "🔗 https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

      - name: 📬 Telegram Notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="*🐧 ARKAEL KERNEL - ALL GKI* ✅
          
          📦 Type: \`${{ needs.prepare.outputs.release_type }}\`
          🎛️ Gov: \`${{ needs.prepare.outputs.governor_choice }}\`
          📊 Files: \`${total_files}\`
          📅 ${BUILD_TIMESTAMP}
          🔗 [Download](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG})"
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" -d "parse_mode=markdown" -d "text=${MSG}"

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files** | \`${total_files}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Link** | [View](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG}) |" >> $GITHUB_STEP_SUMMARY
