# * Version: 2.0 | Professional Edition
# */

name: Release Build - All GKI (Selectable)

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Build Type'
        default: 'full'
        type: choice
        options:
          - 'full'      # Complete build: Vanilla + KSU + KSU+SuSFS + SukiSU
          - 'ksu'       # KSU variants only: KSU + KSU+SuSFS + SukiSU
          - 'no'        # Vanilla/No-root only
          - 'sukisu'    # SukiSU variant only

      GOVERNOR_CHOICE:
        description: '🎛️ CPU Governor Selection'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'   # VortexCore governor
          - 'arkael'       # Arkael governor  
          - 'all'          # Build both governors

      # ============================================
      # 🆕 KERNEL VERSION SELECTOR (Per-GKI Build)
      # ============================================
      KERNEL_VERSION:
        description: '🐧 GKI Kernel Version to Build'
        default: 'all'
        type: choice
        options:
          - 'all'         # Build ALL versions: 5.10 + 6.1 + 6.6
          - '5.10'        # GKI 5.10 ONLY
          - '6.1'         # GKI 6.1 ONLY
          - '6.6'         # GKI 6.6 ONLY

      VORTEX_GKI_FILE:
        description: '📁 Custom Vortex GKI Source File (Optional)'
        default: 'vortex_gki.c'
        type: string

# ============================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================
env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive
  BUILD_SYSTEM: "Arkael-Kernel-v2.0"

jobs:
  # ╔════════════════════════════════════════╗
  # ║  JOB 1: KERNEL BUILD ENGINE            ║
  # ╚════════════════════════════════════════╝
  build:
    name: "🔨 Build [${{ inputs.KERNEL_VERSION }}] ${{ inputs.RELEASE_TYPE }} | ${{ inputs.GOVERNOR_CHOICE }}"
    runs-on: ubuntu-latest
    
    steps:
      # ------------------------------------------
      # STEP 1: Repository Checkout
      # ------------------------------------------
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # ------------------------------------------
      # STEP 2: Environment Preparation & Config
      # ------------------------------------------
      - name: ⚙️ Initialize Build Environment
        id: prepare
        run: |
          echo "╔═══════════════════════════════════════════════╗"
          echo "║     ARKAEL KERNEL BUILD SYSTEM v2.0           ║"
          echo "║     Mode: Per-GKI Selection                   ║"
          echo "╚═══════════════════════════════════════════════╝"
          
          # Capture user inputs
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          KV="${{ inputs.KERNEL_VERSION }}"
          
          echo ""
          echo "┌─────────────────────────────────────────────┐"
          echo "│ ⚙️  BUILD CONFIGURATION                     │"
          echo "├─────────────────────────────────────────────┤"
          echo "│ • Release Type  : ${RT}"
          echo "│ • Governor(s)   : ${GC}"
          echo "│ • Kernel Ver    : ${KV}"
          echo "└─────────────────────────────────────────────┘"
          echo ""
          
          # ==========================================
          # INSTALL BUILD DEPENDENCIES
          # ==========================================
          echo "[INFO] Installing build dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq \
            python3-pip python3-lxml gcc make \
            libncurses-dev g++ gzip perl
            
          pip3 install lxml -qq 2>/dev/null || true
          
          # Create output directories
          mkdir -p artifacts/{kernel,logs}
          
          # ==========================================
          # PROCESS GOVERNOR SELECTION
          # ==========================================
          if [ "${GC}" = "all" ]; then
            GOVS="vortexcore arkael"
            echo "[CONFIG] Building with ALL governors: ${GOVS}"
          else
            GOVS="${GC}"
            echo "[CONFIG] Building with governor: ${GOVS}"
          fi
          
          # ==========================================
          # 🆕 PROCESS KERNEL VERSION SELECTION
          # ==========================================
          case "${KV}" in
            all)
              KERNEL_LIST="5.10 6.1 6.6"
              echo "[CONFIG] Building ALL kernel versions"
              ;;
            5.10|6.1|6.6)
              KERNEL_LIST="${KV}"
              echo "[CONFIG] Building kernel version: ${KV} ONLY"
              ;;
            *)
              echo "[ERROR] Invalid kernel version: ${KV}"
              exit 1
              ;;
          esac
          
          # ==========================================
          # GENERATE BUILD QUEUE
          # ==========================================
          > /tmp/build_queue.txt
          BUILD_COUNT=0
          
          echo ""
          echo "[INFO] Generating build queue..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          case "${RT}" in
            # ----------------------------------------
            # FULL BUILD: All variants
            # ----------------------------------------
            full)
              for KVER in ${KERNEL_LIST}; do
                for GOV in ${GOVS}; do
                  # Format: VERSION|VARIANT_NAME|KSU_ENABLED|SUSFS_ENABLED|GOVERNOR
                  echo "${KVER}|Vanilla|no|false|${GOV}" >> /tmp/build_queue.txt
                  echo "${KVER}|KernelSU|yes|false|${GOV}" >> /tmp/build_queue.txt
                  echo "${KVER}|KernelSU-SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
                  echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
                  BUILD_COUNT=$((BUILD_COUNT + 4))
                  
                  echo "  ✓ Queued: ${KVER} × ${GOV} (All Variants)"
                done
              done
              ;;
            
            # ----------------------------------------
            # KSU BUILD: Root variants only
            # ----------------------------------------
            ksu)
              for KVER in ${KERNEL_LIST}; do
                for GOV in ${GOVS}; do
                  echo "${KVER}|KernelSU|yes|false|${GOV}" >> /tmp/build_queue.txt
                  echo "${KVER}|KernelSU-SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
                  echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
                  BUILD_COUNT=$((BUILD_COUNT + 3))
                  
                  echo "  ✓ Queued: ${KVER} × ${GOV} (KSU Variants)"
                done
              done
              ;;
            
            # ----------------------------------------
            # NO-ROOT BUILD: Vanilla only
            # ----------------------------------------
            no)
              for KVER in ${KERNEL_LIST}; do
                for GOV in ${GOVS}; do
                  echo "${KVER}|Vanilla|no|false|${GOV}" >> /tmp/build_queue.txt
                  BUILD_COUNT=$((BUILD_COUNT + 1))
                  
                  echo "  ✓ Queued: ${KVER} × ${GOV} (Vanilla)"
                done
              done
              ;;
            
            # ----------------------------------------
            # SUKISU BUILD: SukiSU variant only
            # ----------------------------------------
            sukisu)
              for KVER in ${KERNEL_LIST}; do
                for GOV in ${GOVS}; do
                  echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
                  BUILD_COUNT=$((BUILD_COUNT + 1))
                  
                  echo "  ✓ Queued: ${KVER} × ${GOV} (SukiSU)"
                done
              done
              ;;
              
            *)
              echo "[ERROR] Unknown release type: ${RT}"
              exit 1
              ;;
          esac
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "┌─────────────────────────────────────────────┐"
          echo "│ 📋 BUILD QUEUE SUMMARY                      │"
          echo "├─────────────────────────────────────────────┤"
          echo "│ Total Builds Queued : ${BUILD_COUNT}"
          echo "│ Target Kernel(s)    : ${KV} → [${KERNEL_LIST}]"
          echo "│ Release Type        : ${RT}"
          echo "│ Governor(s)         : ${GOVS}"
          echo "└─────────────────────────────────────────────┘"
          echo ""
          
          # Display detailed queue
          echo "Detailed Build Queue:"
          echo "----------------------"
          cat -n /tmp/build_queue.txt | while read num line; do
            echo "  ${line}"
          done
          echo ""
          
          # Export outputs for next steps
          echo "total_builds=${BUILD_COUNT}" >> $GITHUB_OUTPUT
          echo "kernel_versions=${KERNEL_LIST}" >> $GITHUB_OUTPUT
          echo "selected_version=${KV}" >> $GITHUB_OUTPUT

      # ------------------------------------------
      # STEP 3: Execute Build Pipeline
      # ------------------------------------------
      - name: 🔨 Execute Build Pipeline
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "╔═══════════════════════════════════════════════╗"
          echo "║     ▶️  INITIALIZING BUILD PIPELINE           ║"
          echo "╚═══════════════════════════════════════════════╝"
          
          # Security & Permissions
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          
          # Counters
          SUCCESSFUL=0
          FAILED=0
          CURRENT=0
          TOTAL="${{ steps.prepare.outputs.total_builds }}"
          
          # Log file
          BUILD_LOG="artifacts/logs/build_$(date +%Y%m%d_%H%M%S).log"
          echo "Build started at $(date)" > "${BUILD_LOG}"
          
          # ==========================================
          # MAIN BUILD LOOP
          # ==========================================
          while IFS='|' read -r KVER VARIANT KSU_FLAG SUSFS_FLAG GOVERNOR; do
            CURRENT=$((CURRENT + 1))
            
            echo ""
            echo "▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
            echo "  📦 BUILD [#${CURRENT}/${TOTAL}]"
            echo "  ────────────────────────────────────"
            echo "  Kernel : GKI ${KVER}"
            echo "  Variant: ${VARIANT}"
            echo "  Governor: ${GOVERNOR}"
            echo "▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
            echo ""
            
            # Set environment variables for this build iteration
            export TODO="kernel"
            export KSU="${KSU_FLAG}"
            export KSU_SUSFS="${SUSFS_FLAG}"
            export KERNEL_VERSION="${KVER}"
            export KVER="${KVER}"
            export STATUS="RELEASE"
            export GOVERNOR_CHOICE="${GOVERNOR}"
            export VORTEX_GKI_FILE="${VORTEX_GKI_FILE:-vortex_gki.c}"
            
            # Determine if this is the final build (for cleanup purposes)
            if [ "${CURRENT}" -eq "${TOTAL}" ]; then
              export LAST_BUILD="true"
            else
              export LAST_BUILD="false"
            fi
            
            # Clean previous build artifacts
            rm -rf artifacts/kernel/*.zip artifacts/kernel/*.img 2>/dev/null || true
            
            # Execute build script
            BUILD_START=$(date +%s)
            
            if ./build.sh 2>&1 | tee -a "${BUILD_LOG}"; then
              BUILD_END=$(date +%s)
              BUILD_DURATION=$((BUILD_END - BUILD_START))
              
              # Verify output artifacts
              if ls artifacts/kernel/*.zip 1>/dev/null 2>&1 || ls artifacts/kernel/*.img 1>/dev/null 2>&1; then
                echo ""
                echo "  ✅ SUCCESS: ${VARIANT} (${KVER}) [${GOVERNOR}]"
                echo "     Duration: ${BUILD_DURATION}s"
                SUCCESSFUL=$((SUCCESSFUL + 1))
                
                # Rename artifacts with descriptive names
                for ARTIFACT in artifacts/kernel/*.zip artifacts/kernel/*.img; do
                  if [ -f "${ARTIFACT}" ]; then
                    BASENAME=$(basename "${ARTIFACT}")
                    EXT="${BASENAME##*.}"
                    NEW_FILENAME="Arkael-${KVER}-${VARIANT}-${GOVERNOR}.${EXT}"
                    mv "${ARTIFACT}" "artifacts/kernel/${NEW_FILENAME}"
                    echo "     📄 Output: ${NEW_FILENAME}"
                    ls -lh "artifacts/kernel/${NEW_FILENAME}" | awk '{print "     Size: "$5}'
                  fi
                done
              else
                echo ""
                echo "  ⚠️  WARNING: Build completed but no artifacts found!"
                echo "     Variant: ${VARIANT} (${KVER})"
                FAILED=$((FAILED + 1))
                echo "[WARNING] No output for ${VARIANT}-${KVER}" >> "${BUILD_LOG}"
              fi
            else
              BUILD_END=$(date +%s)
              BUILD_DURATION=$((BUILD_END - BUILD_START))
              echo ""
              echo "  ❌ FAILED: ${VARIANT} (${KVER}) [${GOVERNOR}]"
              echo "     Duration: ${BUILD_DURATION}s"
              FAILED=$((FAILED + 1))
              echo "[FAILED] ${VARIANT}-${KVER} after ${BUILD_DURATION}s" >> "${BUILD_LOG}"
            fi
            
          done < /tmp/build_queue.txt
          
          # ==========================================
          # BUILD SUMMARY REPORT
          # ==========================================
          echo ""
          echo "╔═══════════════════════════════════════════════╗"
          echo "║       📊 BUILD SESSION COMPLETE               ║"
          echo "╠═══════════════════════════════════════════════╣"
          echo "║                                               ║"
          printf "║  ✅ Successful Builds : %-26s║\n" "${SUCCESSFUL}"
          printf "║  ❌ Failed Builds     : %-26s║\n" "${FAILED}"
          printf "║  📊 Total Processed   : %-26s║\n" "${CURRENT}/${TOTAL}"
          echo "║                                               ║"
          echo "╚═══════════════════════════════════════════════╝"
          echo ""
          
          # List all generated artifacts
          echo "Generated Artifacts:"
          echo "--------------------"
          if [ "$(ls -A artifacts/kernel/ 2>/dev/null)" ]; then
            ls -lh artifacts/kernel/
          else
            echo "  (No artifacts generated)"
          fi
          
          # Append summary to log
          {
            echo ""
            echo "=== BUILD SUMMARY ==="
            echo "Successful: ${SUCCESSFUL}"
            echo "Failed: ${FAILED}"
            echo "Total: ${CURRENT}/${TOTAL}"
            echo "Timestamp: $(date)"
          } >> "${BUILD_LOG}"
          
          # Fail job only if ALL builds failed
          if [ "${SUCCESSFUL}" -eq 0 ] && [ "${FAILED}" -gt 0 ]; then
            echo ""
            echo "❌ CRITICAL: All builds in queue failed!"
            echo "Check logs for details: ${BUILD_LOG}"
            exit 1
          fi

      # ------------------------------------------
      # STEP 4: Upload Build Artifacts
      # ------------------------------------------
      - name: 📤 Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Arkael-GKI${{ inputs.KERNEL_VERSION }}-${{ inputs.RELEASE_TYPE }}-${{ inputs.GOVERNOR_CHOICE }}-${{ github.run_id }}"
          path: artifacts/kernel/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: 📝 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Build-Logs-${{ github.run_id }}"
          path: artifacts/logs/
          retention-days: 7
          if-no-files-found: ignore

  # ╔════════════════════════════════════════╗
  # ║  JOB 2: RELEASE CREATION               ║
  # ╚════════════════════════════════════════╝
  release:
    name: "🚀 Create GitHub Release"
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download Artifacts
        uses: actions/download-artifact@v4
        id: download
        with:
          path: release_files
          pattern: 'Arkael-*'
          merge-multiple: true

      - name: 🔍 Validate & Organize Files
        run: |
          echo "[RELEASE] Validating downloaded artifacts..."
          
          # Check if files exist
          if find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | grep -q .; then
            mkdir -p release_output
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) -exec cp {} release_output/ \;
            
            FILE_COUNT=$(find release_output -type f | wc -l)
            TOTAL_SIZE=$(du -sh release_output | cut -f1)
            
            echo "✅ Found ${FILE_COUNT} artifact(s)"
            echo "   Total size: ${TOTAL_SIZE}"
            echo ""
            echo "File listing:"
            ls -lh release_output/
            
            echo "file_count=${FILE_COUNT}" >> $GITHUB_ENV
            echo "total_size=${TOTAL_SIZE}" >> $GITHUB_ENV
          else
            echo "❌ ERROR: No valid artifacts found!"
            echo "file_count=0" >> $GITHUB_ENV
            exit 1
          fi

      - name: 🏷️ Generate Release Metadata
        id: metadata
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M UTC")
          DATE_TAG=$(date +%Y%m%d-%H%M)
          
          KN="${KERNEL_NAME:-Arkael-Kernel}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          KV="${{ inputs.KERNEL_VERSION }}"
          
          # Generate semantic tag
          TAG="${KN}-GKI${KV}-${RT}-${GC}-${DATE_TAG}"
          
          # Output metadata
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "kernel_name=${KN}" >> $GITHUB_OUTPUT
          
          echo "[META] Generated tag: ${TAG}"

      - name: 🚀 Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ steps.metadata.outputs.release_tag }}"
          KN="${{ steps.metadata.outputs.kernel_name }}"
          TS="${{ steps.metadata.outputs.timestamp }}"
          REPO="Kingfinik98/build-arkael"
          
          echo "[RELEASE] Creating release: ${TAG}"
          
          # Create GitHub Release with professional body
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "🐧 ${KN} | GKI ${{ inputs.KERNEL_VERSION }} | ${{ inputs.RELEASE_TYPE }} | ${TS}" \
            --notes "## 📦 ${KN} Release\n\n\
            ### 🔧 Build Information\n\n\
            | Parameter | Value |\n\
            |-----------|-------|\n\
            | **Kernel Version** | GKI ${{ inputs.KERNEL_VERSION }} |\n\
            | **Release Type** | \`${{ inputs.RELEASE_TYPE }}\` |\n\
            | **Governor** | \`${{ inputs.GOVERNOR_CHOICE }}\` |\n\
            | **Artifacts** | \`${file_count}\` files |\n\
            | **Total Size** | \`${total_size}\` |\n\
            | **Build Date** | ${TS} |\n\n\
            ---\n\n\
            ### 📋 Included Variants\n\n\
            - \`Vanilla\` - No root support\n\
            - \`KernelSU\` - Standard root\n\
            - \`KernelSU-SuSFS\` - Root with SuSFS hidden features\n\
            - \`SukiSU\` - Alternative root implementation\n\n\
            ---\n\n\
            *Built automatically by [Arkael Build System](https://github.com/Kingfinik98/build-arkael)*\n\
            *© 2026 Kingfinik98. All Rights Reserved.*" \
            2>&1 || echo "[WARN] Tag may already exist, continuing..."
          
          # Upload all artifacts
          UPLOAD_COUNT=0
          while IFS= read -r FILE; do
            if [ -f "${FILE}" ]; then
              if gh release upload "${TAG}" --repo "${REPO}" "${FILE}" --clobber 2>/dev/null; then
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
                echo "  ✓ Uploaded: $(basename "${FILE}")"
              else
                echo "  ✗ Failed: $(basename "${FILE}")"
              fi
            fi
          done < <(find release_output -type f \( -name "*.zip" -o -name "*.img" \))
          
          echo ""
          echo "✅ Release complete! Uploaded ${UPLOAD_COUNT}/${file_count} files"
          echo "release_url=https://github.com/${REPO}/releases/tag/${TAG}" >> $GITHUB_ENV

      - name: 📬 Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        if: env.TG_BOT_TOKEN != ''
        run: |
          MSG="*🐧 Arkael Kernel Build Complete* ✅%0A%0A\
          🔧 *Build Details*%0A\
          ━━━━━━━━━━━━━━━━━━%0A\
          📦 Type: \`${{ inputs.RELEASE_TYPE }}\`%0A\
          🐧 Kernel: \`GKI ${{ inputs.KERNEL_VERSION }}\`%0A\
          🎛️ Governor: \`${{ inputs.GOVERNOR_CHOICE }}\`%0A\
          📊 Files: \`${file_count}\` artifacts%0A\
          💾 Size: \`${total_size}\`%0A%0A\
          🔗 [Download Release](${release_url})"
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${MSG}" && echo "" && echo "✅ Telegram notification sent!"

      - name: 📊 Generate Job Summary
        if: always()
        run: |
          echo "## ✅ Release Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernel Version** | GKI \`${{ inputs.KERNEL_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | \`${{ inputs.RELEASE_TYPE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Governor** | \`${{ inputs.GOVERNOR_CHOICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifacts** | \`${file_count}\` files (\`${total_size}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | \`${{ steps.metadata.outputs.release_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`${{ steps.metadata.outputs.timestamp }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- **[Download Release](${release_url})**" >> $GITHUB_STEP_SUMMARY
