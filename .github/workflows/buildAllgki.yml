name: Release Build - GKI Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_VERSION:
        description: Kernel Version
        default: '5.10'
        type: choice
        options:
          - '5.10'
          - '6.1'
          - '6.6'
      RELEASE_TYPE:
        description: Release Mode
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'
      GOVERNOR_CHOICE:
        description: Governor
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'
      VORTEX_GKI_FILE:
        description: Vortex GKI File
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "GKI ${{ inputs.KERNEL_VERSION }} | ${{ inputs.RELEASE_TYPE }} | ${{ inputs.GOVERNOR_CHOICE }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh bc bison flex libssl-dev libelf-dev dwarves cpio wget curl git zip unzip p7zip-full jq
          pip install lxml -qq
          mkdir -p artifacts

      - name: Generate Build Queue
        id: queue
        run: |
          KVER="${{ inputs.KERNEL_VERSION }}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          
          if [ "${GC}" = "all" ]; then
            GOVS="vortexcore arkael"
          else
            GOVS="${GC}"
          fi
          
          > /tmp/build_queue.txt
          
          if [ "${RT}" = "full" ]; then
            for GOV in ${GOVS}; do
              echo "${KVER}|VNL|no|false|${GOV}" >> /tmp/build_queue.txt
              echo "${KVER}|KSU|yes|false|${GOV}" >> /tmp/build_queue.txt
              echo "${KVER}|KSU+SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
              echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
            done
          elif [ "${RT}" = "ksu" ]; then
            for GOV in ${GOVS}; do
              echo "${KVER}|KSU|yes|false|${GOV}" >> /tmp/build_queue.txt
              echo "${KVER}|KSU+SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
              echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
            done
          elif [ "${RT}" = "no" ]; then
            for GOV in ${GOVS}; do
              echo "${KVER}|VNL|no|false|${GOV}" >> /tmp/build_queue.txt
            done
          elif [ "${RT}" = "sukisu" ]; then
            for GOV in ${GOVS}; do
              echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
            done
          fi
          
          TOTAL=$(wc -l < /tmp/build_queue.txt)
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT

      - name: Execute Builds
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          
          OK=0
          FAIL=0
          NUM=0
          TOTAL="${{ steps.queue.outputs.total }}"
          
          while IFS='|' read -r KVER VARIANT KSU SUSFS GOV; do
            NUM=$((NUM + 1))
            echo "[${NUM}/${TOTAL}] Building ${VARIANT} ${KVER} ${GOV}"
            
            export TODO="kernel"
            export KSU="${KSU}"
            export KSU_SUSFS="${SUSFS}"
            export KERNEL_VERSION="${KVER}"
            export KVER="${KVER}"
            export STATUS="RELEASE"
            export GOVERNOR_CHOICE="${GOV}"
            
            if [ "${NUM}" = "${TOTAL}" ]; then
              export LAST_BUILD="true"
            else
              export LAST_BUILD="false"
            fi
            
            rm -rf artifacts/*.zip artifacts/*.img out/ 2>/dev/null || true
            
            set +e
            ./build.sh
            RESULT=$?
            set -e
            
            if [ ${RESULT} -eq 0 ] && ls artifacts/*.zip 1>/dev/null 2>&1; then
              cd artifacts
              for f in *.zip; do
                if [ -f "$f" ]; then
                  mv "$f" "${KVER}-${VARIANT}-${GOV}-${f}"
                fi
              done
              cd ..
              OK=$((OK + 1))
              echo "OK: ${VARIANT}"
            else
              echo "FAIL: ${VARIANT} (exit ${RESULT})"
              FAIL=$((FAIL + 1))
            fi
          done < /tmp/build_queue.txt
          
          echo "Results: ${OK} success, ${FAIL} failed"
          
          if [ ${OK} -eq 0 ] && [ ${FAIL} -gt 0 ]; then
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Arkael-GKI${{ inputs.KERNEL_VERSION }}-${{ inputs.RELEASE_TYPE }}-${{ inputs.GOVERNOR_CHOICE }}"
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create Release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: Prepare Files
        run: |
          find release_files -mindepth 2 -type f 2>/dev/null | while read f; do cp "$f" release_flat/ 2>/dev/null; done
          mkdir -p release_flat
          find release_files -type f \( -name "*.zip" \) -exec cp {} release_flat/ \; 2>/dev/null || true
          rm -rf release_files
          mv release_flat release_files 2>/dev/null || true
          ls -lh release_files/ 2>/dev/null || echo "EMPTY"
          TOTAL=$(find release_files -name "*.zip" 2>/dev/null | wc -l)
          echo "total_files=${TOTAL}" >> $GITHUB_ENV

      - name: Extract Info
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=Arkael-Kernel" >> $GITHUB_ENV
          fi

      - name: Generate Notes
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KVER="${{ inputs.KERNEL_VERSION }}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          KN="${KERNEL_NAME:-Arkael-Kernel}"
          TAG="${KN}-GKI${KVER}-${RT}-${GC}-${TIMESTAMP}"
          
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          
          cat > release_notes.md << EOF
          ## ${KN} - GKI ${KVER}
          
          | Item | Details |
          |------|---------|
          | Kernel | GKI ${KVER} |
          | Type | ${RT} |
          | Governor | ${GC} |
          | Files | ${total_files} |
          
          ---
          Built by Kingfinik98
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="Kingfinik98/build-arkael"
          gh release create "${RELEASE_TAG}" --repo "${REPO}" --title "Arkael GKI ${RELEASE_TAG}" --notes-file release_notes.md || true
          COUNT=0
          for f in release_files/*.zip; do
            if [ -f "$f" ]; then
              gh release upload "${RELEASE_TAG}" --repo "${REPO}" "${f}" --clobber 2>/dev/null && COUNT=$((COUNT+1))
            fi
          done
          echo "Uploaded ${COUNT} files"

      - name: Telegram Notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT_ID}" -d "text=ARKAEL KERNEL GKI ${{ inputs.KERNEL_VERSION }} DONE - Files: ${total_files}"

      - name: Summary
        run: |
          echo "## Done" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | \`${{ inputs.KERNEL_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | \`${{ inputs.RELEASE_TYPE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Files | \`${total_files}\` |" >> $GITHUB_STEP_SUMMARY
