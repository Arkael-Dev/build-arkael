name: Release Build - All GKI

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Mode'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu_only'
          - 'minimal'

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "🐧 ${{ matrix.kernel_version }} | ${{ matrix.variant_name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel_version: ['5.10', '6.1', '6.6']
        include:
          - variant_name: "VNL"
            ksu: "no"
            ksu_susfs: "false"
            last_build: "false"

          - variant_name: "KSU"
            ksu: "yes"
            ksu_susfs: "false"
            last_build: "false"

          - variant_name: "KSU+SuSFS"
            ksu: "yes"
            ksu_susfs: "true"
            last_build: "false"

          - variant_name: "VorteXSU"
            ksu: "vortexsu"
            ksu_susfs: "true"
            last_build: "true"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================
      # 🔥 FIX: SET STATUS=RELEASE (YANG SEBELUMNYA HILANG!)
      # ============================================
      - name: 🔍 Set Build Status
        run: |
          echo "STATUS=RELEASE" >> $GITHUB_ENV
          echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          echo "=========================================="
          echo "  🚀 VORTEX_E-SPORT BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel : ${{ matrix.kernel_version }}"
          echo "  Variant: ${{ matrix.variant_name }}"
          echo "  KSU   : ${{ matrix.ksu }}"
          echo "  SuSFS : ${{ matrix.ksu_susfs }}"
          echo "  Last  : ${{ matrix.last_build }}"
          echo "  STATUS: RELEASE (FIXED!)"
          echo "=========================================="

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full
          pip install lxml

      - name: ⚙️ Run Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          LAST_BUILD: ${{ matrix.last_build }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
        run: |
          echo "▶️ STARTING: ${{ matrix.variant_name }} (${{ matrix.kernel_version }})"
          echo "STATUS=$STATUS"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          ./build.sh
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ Build OK!"

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ github.run_number }}"
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          if-no-files-found: warn

  release:
    name: "🚀 Create Unified Release"
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: 🔍 Extract Build Variables
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=VorteX_E-Sport" >> $GITHUB_ENV
            echo "RELEASE=v0.3" >> $GITHUB_ENV
            echo "LINUX_VERSION=unknown" >> $GITHUB_ENV
            echo "SUSFS_VERSION=N/A" >> $GITHUB_ENV
          fi

      - name: 🏷️ Generate Release Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KERNEL_NAME="${KERNEL_NAME:-VorteX_E-Sport}"
          RELEASE_TAG="${KERNEL_NAME}-AllGKI-${TIMESTAMP}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: 📝 Prepare Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🐧 VorteX_E-Sport - All GKI Release
          
          ### 📋 Build Information
          
          | Item | Details |
          |------|---------|
          | **Kernel Name** | {KERNEL_NAME} |
          | **Build Date** | {TIMESTAMP} |
          | **Kernel Version** | {LINUX_VERSION} |
          | **SuSFS Version** | {SUSFS_VERSION} |
          
          ---
          
          ### 📦 Available Variants
          
          #### 🔵 GKI 5.10 (Android 12/12.1)
          - `VorteX_E-Sport-*-5.10-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-5.10-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-5.10-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-5.10-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          #### 🟢 GKI 6.1 (Android 14)
          - `VorteX_E-Sport-*-6.1-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-6.1-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-6.1-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-6.1-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          #### 🟣 GKI 6.6 (Android 15)
          - `VorteX_E-Sport-*-6.6-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-6.6-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-6.6-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-6.6-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          ---
          
          ### ⚡ Features
          
          - 🎮 **VortexCore Governor** - Custom CPU governor for gaming & daily use
          - 🛡️ **Ultra-Safe Kernel Patches** - Optimized for stability
          - 📸 **Camera Fixes** - Infinix GT 20 Pro camera patch (GKI 5.10)
          - 🎮 **GPU Tuning** - Adreno SkiaVK driver included
          - 🔧 **WiFi/BT Fixes** - SM8650 & WCN3988 support (GKI 6.1)
          
          ### 🔐 Root Solutions (3 Variants)
          
          | Variant | KPM Patch | SuSFS Support | Description |
          |---------|-----------|---------------|-------------|
          | **KSU** | ❌ | ✅ Optional | Standard KernelSU-Next |
          | **VorteXSU** | ✅ | ✅ Recommended | Custom KPM-based root |
          | **VNL** | ❌ | ❌ | No root (vanilla) |
          
          ---
          
          ### 📱 Installation
          
          1. Download ZIP file according to your chosen variant
          2 Flash via AnyKernel3 / Magisk / KernelFlash
          3. Reboot device
          
          > ⚠️ **Backup your data before flashing!**
          
          ---
          
          ### 💬 Support
          
          - 📞 Telegram: [VorteX_E-Sport](https://t.me/VorteX_ESport)
          - 🌐 GitHub: [Kingfinik98/build-vortex](https://github.com/Kingfinik98/build-vortex)
          
          ---
          
          *Built with ❤️ by Kingfinik98 (VorteX_E-Sport)*
          *© 2026 All Rights Reserved*
          EOF
          
          sed -i "s/{KERNEL_NAME}/${KERNEL_NAME:-VorteX_E-Sport}/g" release_notes.md
          sed -i "s/{TIMESTAMP}/${BUILD_TIMESTAMP:-$(date)}/g" release_notes.md
          sed -i "s/{LINUX_VERSION}/${LINUX_VERSION:-Multiple}/g" release_notes.md
          sed -i "s/{SUSFS_VERSION}/${SUSFS_VERSION:-N/A}/g" release_notes.md
          echo "✅ Release notes prepared!"

      - name: 📋 List Build Artifacts
        run: |
          echo "=========================================="
          echo "  📦 ARTIFACTS TO UPLOAD"
          echo "=========================================="
          if [ -d "release_files" ]; then
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) | sort | while read f; do
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              echo "  📄 $(basename "$f") ($SIZE)"
            done
            TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) | wc -l)
            echo ""
            echo "  Total files: $TOTAL"
          else
            echo "  ⚠️ No artifacts found!"
          fi
          echo "=========================================="

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${REPO:-Kingfinik98/build-vortex}"
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 VorteX_E-Sport - All GKI (${BUILD_TIMESTAMP})" \
            --notes-file release_notes.md \
            release_files/*.zip \
            release_files/*.img \
            2>/dev/null || echo "⚠️ Some files may have failed"
          echo "✅ Release created!"
          echo "🔗 https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

      - name: 📬 Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          REPO="${REPO:-Kingfinik98/build-vortex}"
          LINK="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          TOTAL=$(find release_files -name "*.zip" 2>/dev/null | wc -l)
          MSG="*🐧 VORTEX_E-SPORT - ALL GKI RELEASE* 🚀
          
          ✅ *Status*: SUCCESS
          📦 *Builds*: ${TOTAL} ZIPs
          🐧 *Kernels*: 5.10, 6.1, 6.6
          📅 *Date*: ${BUILD_TIMESTAMP}
          🔐 *Root*: KSU, VorteXSU, VNL
          
          ———————————————
          📥 [DOWNLOAD](${LINK})
          ———————————————
          _© 2026 VorteX_E-Sport_"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" && echo "✅ Telegram sent!" || echo "❌ Telegram failed"

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernels** | \`5.10\`, \`6.1\`, \`6.6\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | $(find release_files -name '*.zip' 2>/dev/null | wc -l) files |" >> $GITHUB_STEP_SUMMARY
