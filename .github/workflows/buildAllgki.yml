# * FIXED: Full mode should build ALL variants!
# */

name: Release Build - GKI Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_VERSION:
        description: '🐧 Kernel Version (GKI)'
        default: '5.10'
        type: choice
        options:
          - '5.10'
          - '6.1'
          - '6.6'

      RELEASE_TYPE:
        description: '🎯 Release Mode'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'

      GOVERNOR_CHOICE:
        description: '🎛️ Governor'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'

      VORTEX_GKI_FILE:
        description: '📁 Vortex GKI File'
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "🐧 GKI ${{ inputs.KERNEL_VERSION }} | ${{ inputs.RELEASE_TYPE }} | ${{ inputs.GOVERNOR_CHOICE }}"
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq
          pip install lxml -qq
          mkdir -p artifacts

      - name: 🔧 Generate Build Queue
        id: queue
        run: |
          KVER="${{ inputs.KERNEL_VERSION }}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          
          echo "=========================================="
          echo "  ARKAEL KERNEL BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel   : ${KVER}"
          echo "  Mode     : ${RT}"
          echo "  Governor : ${GC}"
          echo "=========================================="
          
          # Set governors
          if [ "${GC}" = "all" ]; then
            GOVS="vortexcore arkael"
          else
            GOVS="${GC}"
          fi
          
          # Generate build list
          > /tmp/build_queue.txt
          
          case "${RT}" in
            full)
              # FULL = Semua 4 variant (VNL, KSU, KSU+SuSFS, SukiSU)
              for GOV in ${GOVS}; do
                echo "${KVER}|VNL|no|false|${GOV}" >> /tmp/build_queue.txt
                echo "${KVER}|KSU|yes|false|${GOV}" >> /tmp/build_queue.txt
                echo "${KVER}|KSU+SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
                echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
              done
              MODE_DESC="All Variants (VNL, KSU, KSU+SuSFS, SukiSU)"
              ;;
            ksu)
              # KSU = Hanya variants dengan root
              for GOV in ${GOVS}; do
                echo "${KVER}|KSU|yes|false|${GOV}" >> /tmp/build_queue.txt
                echo "${KVER}|KSU+SuSFS|yes|true|${GOV}" >> /tmp/build_queue.txt
                echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
              done
              MODE_DESC="Root Variants (KSU, KSU+SuSFS, SukiSU)"
              ;;
            no)
              # NO = Vanilla only
              for GOV in ${GOVS}; do
                echo "${KVER}|VNL|no|false|${GOV}" >> /tmp/build_queue.txt
              done
              MODE_DESC="Vanilla Only (No Root)"
              ;;
            sukisu)
              # SUKISU = Hanya SukiSU
              for GOV in ${GOVS}; do
                echo "${KVER}|SukiSU|sukisu|true|${GOV}" >> /tmp/build_queue.txt
              done
              MODE_DESC="SukiSU Only (KPM Patch)"
              ;;
          esac
          
          TOTAL=$(wc -l < /tmp/build_queue.txt)
          
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  BUILD QUEUE                            ║"
          echo "╠══════════════════════════════════════════╣"
          printf "║  Mode  : %-30s ║\n" "${MODE_DESC}"
          printf "║  Total : %-2d builds                     ║\n" "${TOTAL}"
          echo "╠══════════════════════════════════════════╣"
          echo "║  List:                                  ║"
          NUM=0
          while IFS='|' read -r kv var ksu susfs gov; do
            NUM=$((NUM + 1))
            printf "║  %2d. [%s] %-12s (%s)           ║\n" "${NUM}" "${kv}" "${var}" "${gov}"
          done < /tmp/build_queue.txt
          echo "╚══════════════════════════════════════════╝"
          
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "kernel_version=${KVER}" >> $GITHUB_OUTPUT
          echo "release_type=${RT}" >> $GITHUB_OUTPUT
          echo "governor_choice=${GC}" >> $GITHUB_OUTPUT
          echo "mode_desc=${MODE_DESC}" >> $GITHUB_OUTPUT

      - name: 🚀 Execute Builds
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "=========================================="
          echo "  STARTING BUILD PROCESS"
          echo "=========================================="
          echo "Mode: ${{ steps.queue.outputs.mode_desc }}"
          echo "=========================================="
          
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          
          OK=0
          FAIL=0
          NUM=0
          TOTAL="${{ steps.queue.outputs.total }}"
          
          while IFS='|' read -r KVER VARIANT KSU SUSFS GOV; do
            NUM=$((NUM + 1))
            
            echo ""
            echo "████████████████████████████████████████"
            echo "  [${NUM}/${TOTAL}] Building: ${VARIANT}"
            echo "  Kernel: ${KVER} | Governor: ${GOV}"
            echo "  KSU=${KSU} | SuSFS=${SUSFS}"
            echo "████████████████████████████████████████"
            
            # Export environment untuk build.sh
            export TODO="kernel"
            export KSU="${KSU}"
            export KSU_SUSFS="${SUSFS}"
            export KERNEL_VERSION="${KVER}"
            export KVER="${KVER}"
            export STATUS="RELEASE"
            export GOVERNOR_CHOICE="${GOV}"
            
            # Last build flag
            if [ "${NUM}" = "${TOTAL}" ]; then
              export LAST_BUILD="true"
              echo "  ⚠️  This is the LAST build (will generate info.txt)"
            else
              export LAST_BUILD="false"
            fi
            
            # Clean artifacts sebelumnya
            rm -rf artifacts/*.zip artifacts/*.img out/ 2>/dev/null || true
            
            # Jalankan build.sh dengan full output
            echo ""
            echo "▶️  Running build.sh..."
            set +e
            ./build.sh 2>&1 | tee /tmp/build_${NUM}.log
            RESULT=$?
            set -e
            
            echo ""
            echo "  Exit Code: ${RESULT}"
            
            if [ ${RESULT} -eq 0 ]; then
              # Cek apakah artifacts benar-bear ada
              ARTIFACT_COUNT=$(find artifacts -name "*.zip" 2>/dev/null | wc -l)
              
              if [ "${ARTIFACT_COUNT}" -gt 0 ]; then
                echo "  ✅ SUCCESS! Found ${ARTIFACT_COUNT} artifact(s)"
                
                # Rename artifacts
                cd artifacts
                for f in *.zip; do
                  if [ -f "$f" ]; then
                    NEWNAME="${KVER}-${VARIANT}-${GOV}-${f}"
                    mv "$f" "${NEWNAME}"
                    SIZE=$(du -h "${NEWNAME}" | cut -f1)
                    echo "  📄 ${NEWNAME} (${SIZE})"
                  fi
                done
                cd ..
                OK=$((OK + 1))
              else
                echo "  ⚠️  WARNING: Build succeeded but NO artifacts found!"
                echo "  Check build log above for details."
                FAIL=$((FAIL + 1))
                
                # Show last 20 lines of build log
                echo "--- Last 20 lines of build log ---"
                tail -20 /tmp/build_${NUM}.log
              fi
            else
              echo "  ❌ FAILED with exit code ${RESULT}!"
              echo ""
              echo "--- Error Log (last 30 lines) ---"
              tail -30 /tmp/build_${NUM}.log
              echo "--- End of Error Log ---"
              FAIL=$((FAIL + 1))
            fi
            
          done < /tmp/build_queue.txt
          
          echo ""
          echo "=========================================="
          echo "  FINAL RESULTS"
          echo "=========================================="
          echo "  ✅ Successful : ${OK}"
          echo "  ❌ Failed     : ${FAIL}"
          echo "  📊 Total      : ${NUM}/${TOTAL}"
          echo "=========================================="
          
          # Write to summary
          echo "success=${OK}" >> $GITHUB_STEP_SUMMARY
          echo "failed=${FAIL}" >> $GITHUB_STEP_SUMMARY
          echo "total=${NUM}" >> $GITHUB_STEP_SUMMARY
          
          echo ""
          echo "📦 Final Artifacts:"
          ls -lh artifacts/ 2>/dev/null || echo "  (empty)"
          
          # Fail jika semua gagal
          if [ ${OK} -eq 0 ] && [ ${FAIL} -gt 0 ]; then
            echo "::error::All ${TOTAL} builds failed!"
            exit 1
          fi
          
          # Warning jika ada yang gagal
          if [ ${FAIL} -gt 0 ]; then
            echo "::warning::${FAIL} out of ${TOTAL} builds failed"

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Arkael-GKI${{ inputs.KERNEL_VERSION }}-${{ inputs.RELEASE_TYPE }}-${{ inputs.GOVERNOR_CHOICE }}"
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  release:
    name: "🚀 Create Release"
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: 🔍 Prepare Files
        run: |
          if find release_files -mindepth 2 -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | grep -q .; then
            mkdir -p release_flat
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) -exec cp {} release_flat/ \;
            rm -rf release_files
            mv release_flat release_files
          fi
          
          echo "Release Files:"
          ls -lh release_files/ 2>/dev/null || echo "  EMPTY!"
          
          TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo "total_files=${TOTAL}" >> $GITHUB_ENV
          
          if [ "${TOTAL}" -eq 0 ]; then
            echo "No files to release"
            exit 0
          fi

      - name: 🔍 Extract Info
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=Arkael-Kernel" >> $GITHUB_ENV
            echo "RELEASE=v0.3" >> $GITHUB_ENV
          fi

      - name: 📝 Generate Release Notes
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KVER="${{ inputs.KERNEL_VERSION }}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          KN="${KERNEL_NAME:-Arkael-Kernel}"
          
          case "${KVER}" in
            5.10) ANDROID_VER="Android 12/12.1" ;;
            6.1)  ANDROID_VER="Android 14" ;;
            6.6)  ANDROID_VER="Android 15" ;;
          esac
          
          case "${RT}" in
            full)
              VARIANTS="- VNL (Vanilla - No Root)
- KSU (Standard KernelSU)
- KSU+SuSFS (KernelSU + Hidden Root)
- SukiSU-Ultra (KPM Patch)" 
              ;;
            ksu)
              VARIANTS="- KSU (Standard KernelSU)
- KSU+SuSFS (Hidden Root)
- SukiSU-Ultra (KPM Patch)"
              ;;
            no)
              VARIANTS="- VNL (Vanilla - No Root)"
              ;;
            sukisu)
              VARIANTS="- SukiSU-Ultra (KPM Patch)"
              ;;
          esac
          
          cat > release_notes.md << EOF
## ${KN} - GKI ${KVER} Release

### Information
| Item | Details |
|------|---------|
| **Kernel Version** | GKI ${KVER} (${ANDROID_VER}) |
| **Release Type** | ${RT} |
| **Governor** | ${GC} |
| **Total Files** | ${total_files} |

### Variants Included
 ${VARIANTS}

---
*Built by Kingfinik98*
*© 2026 Arkael Kernel*
EOF
          
          echo "Notes generated!"

      - name: 🏷️ Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KVER="${{ inputs.KERNEL_VERSION }}"
          RT="${{ inputs.RELEASE_TYPE }}"
          GC="${{ inputs.GOVERNOR_CHOICE }}"
          KN="${KERNEL_NAME:-Arkael-Kernel}"
          
          TAG="${KN}-GKI${KVER}-${RT}-${GC}-${TIMESTAMP}"
          REPO="Kingfinik98/build-arkael"
          
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "Arkael Kernel - GKI ${KVER} (${RT}) ${TIMESTAMP}" \
            --notes-file release_notes.md \
            || true
          
          COUNT=0
          for f in release_files/*.zip; do
            if [ -f "$f" ]; then
              gh release upload "${TAG}" --repo "${REPO}" "${f}" --clobber 2>/dev/null
              COUNT=$((COUNT + 1))
            fi
          done
          
          echo "Released ${COUNT} files as ${TAG}"
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

      - name: 📬 Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="*ARKAEL KERNEL - GKI ${{ inputs.KERNEL_VERSION }}* ✅

Mode: \`${{ inputs.RELEASE_TYPE }}\`
Governor: \`${{ inputs.GOVERNOR_CHOICE }}\`
Files: \`${total_files}\`

[Download](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG})

_Kingfinik98_"
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=markdown" \
            -d "text=${MSG}" || true

      - name: 📊 Summary
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernel** | \`GKI ${{ inputs.KERNEL_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | \`${{ inputs.RELEASE_TYPE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Governor** | \`${{ inputs.GOVERNOR_CHOICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Files** | \`${total_files}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
