name: Release Build - All GKI

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Mode'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu_only'
          - 'minimal'

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: "🐧 ${{ matrix.kernel_version }} | ${{ matrix.variant_name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== GKI 5.10 (Android 12/12.1) =====
          - kernel_version: "5.10"
            variant_name: "VNL"
            ksu: "no"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "5.10"
            variant_name: "KSU"
            ksu: "yes"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "5.10"
            variant_name: "KSU+SuSFS"
            ksu: "yes"
            ksu_susfs: "true"
            last_build: "false"

          - kernel_version: "5.10"
            variant_name: "VorteXSU"
            ksu: "vortexsu"
            ksu_susfs: "true"
            last_build: "false"

          # ===== GKI 6.1 (Android 14) =====
          - kernel_version: "6.1"
            variant_name: "VNL"
            ksu: "no"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "6.1"
            variant_name: "KSU"
            ksu: "yes"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "6.1"
            variant_name: "KSU+SuSFS"
            ksu: "yes"
            ksu_susfs: "true"
            last_build: "false"

          - kernel_version: "6.1"
            variant_name: "VorteXSU"
            ksu: "vortexsu"
            ksu_susfs: "true"
            last_build: "false"

          # ===== GKI 6.6 (Android 15) =====
          - kernel_version: "6.6"
            variant_name: "VNL"
            ksu: "no"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "6.6"
            variant_name: "KSU"
            ksu: "yes"
            ksu_susfs: "false"
            last_build: "false"

          - kernel_version: "6.6"
            variant_name: "KSU+SuSFS"
            ksu: "yes"
            ksu_susfs: "true"
            last_build: "false"

          - kernel_version: "6.6"
            variant_name: "VorteXSU"
            ksu: "vortexsu"
            ksu_susfs: "true"
            last_build: "true"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Initialize Build Environment
        run: |
          echo "STATUS=RELEASE" >> $GITHUB_ENV
          echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          echo "=========================================="
          echo "  🚀 VORTEX_E-SPORT BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel   : ${{ matrix.kernel_version }}"
          echo "  Variant  : ${{ matrix.variant_name }}"
          echo "  KSU      : ${{ matrix.ksu }}"
          echo "  SuSFS    : ${{ matrix.ksu_susfs }}"
          echo "  Last Build: ${{ matrix.last_build }}"
          echo "=========================================="

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full
          pip install lxml

      - name: ⚙️ Execute Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          LAST_BUILD: ${{ matrix.last_build }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
        run: |
          echo "▶️ BUILD: ${{ matrix.variant_name }} (${{ matrix.kernel_version }})"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          ./build.sh
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ Build OK!"

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ github.run_number }}"
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          if-no-files-found: warn

  release:
    name: "🚀 Create Unified Release"
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      # =====================================================================
      # ✅ NEW: Debug & Flatten Artifact Structure
      # =====================================================================
      - name: 🔍 Inspect & Prepare Artifacts
        run: |
          echo "=========================================="
          echo "  🔍 ARTIFACT STRUCTURE INSPECTION"
          echo "=========================================="
          
          # Show directory structure
          echo ""
          echo "📁 Directory tree:"
          find release_files -type f 2>/dev/null | head -20
          
          echo ""
          echo "📊 File count:"
          find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l
          
          # Check if files are in subdirectories
          DEEP_FILES=$(find release_files -mindepth 2 -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo ""
          echo "📂 Files in subdirectories: ${DEEP_FILES}"
          
          # If files are in subfolders, flatten them
          if [ "${DEEP_FILES}" -gt 0 ]; then
            echo ""
            echo "🔧 Flattening artifact structure..."
            mkdir -p release_flat
            
            # Move all zip/img files to flat directory
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | while read f; do
              cp "$f" release_flat/
              echo "  ✓ Copied: $(basename "$f")"
            done
            
            # Replace original with flattened
            rm -rf release_files
            mv release_flat release_files
          fi
          
          echo ""
          echo "=========================================="
          echo "  ✅ FINAL ARTIFACT LIST"
          echo "=========================================="
          ls -lh release_files/ 2>/dev/null || echo "  ⚠️ No files found!"
          echo "=========================================="

      # =====================================================================
      # ✅ BUGFIX #003: Enhanced Build Variables Extraction
      # =====================================================================
      
      - name: 🔍 Extract Build Variables (Enhanced)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "=========================================="
          echo "  🔍 EXTRACTING BUILD VARIABLES"
          echo "=========================================="
          
          # Initialize variables
          KERNEL_NAME="VorteX_E-Sport"
          LINUX_VERSION=""
          SUSFS_VERSION=""
          RELEASE_VER="v0.3"
          
          # Method 1: Try to read from info.txt files
          echo ""
          echo "📄 Method 1: Scanning for info.txt files..."
          INFO_FILES=$(find release_files -name "info.txt" -type f 2>/dev/null)
          
          if [ -n "${INFO_FILES}" ]; then
            echo "  ✓ Found $(echo "${INFO_FILES}" | wc -l) info.txt file(s)"
            
            while IFS= read -r INFO_FILE; do
              echo "  📖 Reading: ${INFO_FILE}"
              
              # Parse key=value pairs (robust parsing)
              while IFS='=' read -r key value; do
                # Skip empty lines and comments
                [[ -z "${key}" || "${key}" =~ ^[[:space:]]*# ]] && continue
                
                # Trim whitespace
                key=$(echo "${key}" | xargs)
                value=$(echo "${value}" | xargs)
                
                # Store variables (use first non-empty value)
                if [[ -n "${key}" && -n "${value}" ]]; then
                  case "${key}" in
                    KERNEL_NAME)
                      [ -z "${KERNEL_NAME}" ] && KERNEL_NAME="${value}"
                      echo "    → KERNEL_NAME = ${value}"
                      ;;
                    LINUX_VERSION|KERNEL_VERSION|VERSION)
                      [ -z "${LINUX_VERSION}" ] && LINUX_VERSION="${value}"
                      echo "    → LINUX_VERSION = ${value}"
                      ;;
                    SUSFS_VERSION|SUSFS)
                      [ -z "${SUSFS_VERSION}" ] && SUSFS_VERSION="${value}"
                      echo "    → SUSFS_VERSION = ${value}"
                      ;;
                    RELEASE|BUILD_VERSION)
                      [ -z "${RELEASE_VER}" ] && RELEASE_VER="${value}"
                      echo "    → RELEASE = ${value}"
                      ;;
                  esac
                fi
              done < "${INFO_FILE}"
            done <<< "${INFO_FILES}"
          else
            echo "  ℹ️ No info.txt files found"
          fi
          
          # Method 2: Auto-detect from artifact filenames
          echo ""
          echo "📦 Method 2: Auto-detecting from artifacts..."
          
          # Detect kernel versions from ZIP filenames
          DETECTED_KERNELS=$(find release_files -name "*.zip" 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')
          
          if [ -n "${DETECTED_KERNELS}" ]; then
            echo "  ✓ Detected kernel versions: ${DETECTED_KERNELS}"
            
            # If LINUX_VERSION still empty, use detected
            if [ -z "${LINUX_VERSION}" ]; then
              LINUX_VERSION="${DETECTED_KERNELS}"
              echo "  → Set LINUX_VERSION = ${LINUX_VERSION}"
            fi
          else
            echo "  ⚠️ Could not detect from filenames"
          fi
          
          # Method 3: Try to extract SuSFS version from ZIP contents or common locations
          echo ""
          echo "🔍 Method 3: Searching for SuSFS version..."
          
          # Check common SuSFS version indicators
          SUSFS_INDICATORS=$(find release_files -type f 2>/dev/null \
            | xargs strings 2>/dev/null \
            | grep -oiE '(susfs|SuSFS)[_-]?[0-9]+\.[0-9]+' \
            | head -1 \
            | grep -oE '[0-9]+\.[0-9]+.*')
          
          if [ -n "${SUSFS_INDICATORS}" ]; then
            SUSFS_VERSION="${SUSFS_INDICATORS}"
            echo "  ✓ Found SuSFS version indicator: ${SUSFS_VERSION}"
          else
            # Try alternative: check if any filename contains susfs
            SUSFS_FILE=$(find release_files -name "*susfs*" -o -name "*SuSFS*" 2>/dev/null | head -1)
            if [ -n "${SUSFS_FILE}" ]; then
              SUSFS_VERSION="Included (see builds)"
              echo "  ✓ SuSFS present in build artifacts"
            else
              SUSFS_VERSION="Not Included"
              echo "  ℹ️ No SuSFS found in this build"
            fi
          fi
          
          # Final fallbacks if still empty
          [ -z "${LINUX_VERSION}" ] && LINUX_VERSION="5.10.x / 6.1.x / 6.6.x"
          [ -z "${SUSFS_VERSION}" ] && SUSFS_VERSION="Check Individual Builds"
          [ -z "${RELEASE_VER}" ] && RELEASE_VER="v0.3"
          
          # Export all variables to GitHub ENV
          echo ""
          echo "=========================================="
          echo "  ✅ FINAL VARIABLES"
          echo "=========================================="
          echo "KERNEL_NAME=${KERNEL_NAME}" >> $GITHUB_ENV
          echo "LINUX_VERSION=${LINUX_VERSION}" >> $GITHUB_ENV
          echo "SUSFS_VERSION=${SUSFS_VERSION}" >> $GITHUB_ENV
          echo "RELEASE=${RELEASE_VER}" >> $GITHUB_ENV
          
          echo "  KERNEL_NAME   : ${KERNEL_NAME}"
          echo "  LINUX_VERSION : ${LINUX_VERSION}"
          echo "  SUSFS_VERSION : ${SUSFS_VERSION}"
          echo "  RELEASE       : ${RELEASE_VER}"
          echo "=========================================="

      - name: 🏷️ Generate Release Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KERNEL_NAME="${KERNEL_NAME:-VorteX_E-Sport}"
          RELEASE_TAG="${KERNEL_NAME}-AllGKI-${TIMESTAMP}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      # =====================================================================
      # ✅ UPDATED: Telegram Link Fixed to https://t.me/vortexgki
      # =====================================================================
      
      - name: 📝 Prepare Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🐧 VorteX_E-Sport - All GKI Release
          
          ### 📋 Build Information
          
          | Item | Details |
          |------|---------|
          | **Kernel Name** | {KERNEL_NAME} |
          | **Build Date** | {TIMESTAMP} |
          | **Kernel Version** | {LINUX_VERSION} |
          | **SuSFS Version** | {SUSFS_VERSION} |
          
          ---
          
          ### 📦 Available Variants
          
          #### 🔵 GKI 5.10 (Android 12/12.1)
          - `VorteX_E-Sport-*-5.10-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-5.10-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-5.10-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-5.10-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          #### 🟢 GKI 6.1 (Android 14)
          - `VorteX_E-Sport-*-6.1-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-6.1-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-6.1-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-6.1-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          #### 🟣 GKI 6.6 (Android 15)
          - `VorteX_E-Sport-*-6.6-VNL.zip` - Vanilla (No Root)
          - `VorteX_E-Sport-*-6.6-KSU.zip` - Standard KernelSU
          - `VorteX_E-Sport-*-6.6-KSU+SuSFS.zip` - KernelSU + Hidden Root
          - `VorteX_E-Sport-*-6.6-VorteXSU+SuSFS.zip` - VorteXSU (KPM Patch)
          
          ---
          
          ### ⚡ Features
          
          - 🎮 **VortexCore Governor** - Custom CPU governor for gaming & daily use
          - 🛡️ **Ultra-Safe Kernel Patches** - Optimized for stability
          - 📸 **Camera Fixes** - Infinix GT 20 Pro camera patch (GKI 5.10)
          - 🎮 **GPU Tuning** - Adreno SkiaVK driver included
          - 🔧 **WiFi/BT Fixes** - SM8650 & WCN3988 support (GKI 6.1)
          
          ### 🔐 Root Solutions (3 Variants)
          
          | Variant | KPM Patch | SuSFS Support | Description |
          |---------|-----------|---------------|-------------|
          | **KSU** | ❌ | ✅ Optional | Standard KernelSU-Next |
          | **VorteXSU** | ✅ | ✅ Recommended | Custom KPM-based root |
          | **VNL** | ❌ | ❌ | No root (vanilla) |
          
          ---
          
          ### 📱 Installation
          
          1. Download ZIP file according to your chosen variant
          2 Flash via AnyKernel3 / Magisk / KernelFlash
          3. Reboot device
          
          > ⚠️ **Backup your data before flashing!**
          
          ---
          
          ### 💬 Support
          
          - 📞 Telegram: [VortexGKI Community](https://t.me/vortexgki)
          - 🌐 GitHub: [Kingfinik98/build-vortex](https://github.com/Kingfinik98/build-vortex)
          
          ---
          
          *Built with ❤️ by Kingfinik98 (VorteX_E-Sport)*
          *© 2026 All Rights Reserved*
          EOF
          
          # ✅ BUGFIX #001: Safe sed substitution with pipe delimiter
          sed -i "s|{KERNEL_NAME}|${KERNEL_NAME:-VorteX_E-Sport}|g" release_notes.md
          sed -i "s|{TIMESTAMP}|${BUILD_TIMESTAMP:-$(date +%Y%m%d-%H%M)}|g" release_notes.md
          sed -i "s|{LINUX_VERSION}|${LINUX_VERSION:-Multiple GKI Versions}|g" release_notes.md
          sed -i "s|{SUSFS_VERSION}|${SUSFS_VERSION:-See Build Details}|g" release_notes.md
          echo "✅ Release notes prepared!"

      - name: 📋 List Build Artifacts
        run: |
          echo "=========================================="
          echo "  📦 ARTIFACTS TO UPLOAD"
          echo "=========================================="
          if [ -d "release_files" ]; then
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) | sort | while read f; do
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              echo "  📄 $(basename "$f") ($SIZE)"
            done
            TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) | wc -l)
            echo ""
            echo "  Total files: $TOTAL"
          else
            echo "  ⚠️ No artifacts found!"
          fi
          echo "=========================================="

      # =====================================================================
      # ✅ BUGFIX #002: Fixed Subshell Loop & Variable Typo
      # =====================================================================
      
      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${REPO:-Kingfinik98/build-vortex}"
          
          echo "=========================================="
          echo "  🚀 CREATING GITHUB RELEASE"
          echo "=========================================="
          echo "  Repo     : ${REPO}"
          echo "  Tag      : ${RELEASE_TAG}"
          echo "  Timestamp: ${BUILD_TIMESTAMP}"
          echo "  Kernel   : ${LINUX_VERSION}"
          echo "  SuSFS    : ${SUSFS_VERSION}"
          echo "=========================================="
          
          # Step 1: Create release FIRST (without assets)
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 VorteX_E-Sport - All GKI (${BUILD_TIMESTAMP})" \
            --notes-file release_notes.md \
            || {
              echo "⚠️ Release already exists or creation failed, trying to update..."
              gh release edit "${RELEASE_TAG}" \
                --repo "${REPO}" \
                --title "🐧 VorteX_E-Sport - All GKI (${BUILD_TIMESTAMP})" \
                --notes-file release_notes.md \
                2>/dev/null || true
            }
          
          echo "✅ Release created/updated!"
          
          # Step 2: Initialize counters (BEFORE loop - critical!)
          UPLOAD_COUNT=0
          FAIL_COUNT=0
          
          # Step 3: Upload assets using PROCESS SUBSTITUTION (not pipe!)
          echo ""
          echo "📤 Uploading assets..."
          
          if [ -d "release_files" ]; then
            # ✅ BUGFIX #002: Use < <() instead of | to avoid subshell
            while IFS= read -r f; do
              FILENAME=$(basename "$f")
              FILESIZE=$(ls -lh "$f" | awk '{print $5}')
              
              # ✅ BUGFIX #002: Fixed typo - use uppercase FILESIZE
              echo -n "  📤 Uploading ${FILENAME} (${FILESIZE})... "
              
              if gh release upload "${RELEASE_TAG}" \
                --repo "${REPO}" \
                "${f}" \
                --clobber 2>&1; then
                echo "✅ OK"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              else
                echo "❌ FAILED"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            
            done < <(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null)
            
          else
            echo "  ⚠️ No release_files directory found!"
          fi
          
          echo ""
          echo "=========================================="
          echo "  📊 UPLOAD SUMMARY"
          echo "=========================================="
          echo "  ✅ Successful: ${UPLOAD_COUNT} files"
          echo "  ❌ Failed:     ${FAIL_COUNT} files"
          echo "=========================================="
          
          # Verify at least one file uploaded
          if [ "${UPLOAD_COUNT}" -eq 0 ] && [ "${FAIL_COUNT}" -eq 0 ]; then
            echo "⚠️ WARNING: No files were uploaded! Release may be empty."
            exit 1
          fi
          
          echo ""
          echo "✅ Release complete!"
          echo "🔗 https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

      # =====================================================================
      # ✅ UPDATED: Telegram Notification with Correct Link
      # =====================================================================
      
      - name: 📬 Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          REPO="${REPO:-Kingfinik98/build-vortex}"
          LINK="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          TOTAL_ZIPS=$(find release_files -name "*.zip" 2>/dev/null | wc -l)
          MSG="*🐧 VORTEX_E-SPORT - ALL GKI RELEASE* 🚀
          
          ✅ *Status*: SUCCESS
          📦 *Builds*: ${TOTAL_ZIPS} ZIPs
          🐧 *Kernels*: ${LINUX_VERSION}
          📅 *Date*: ${BUILD_TIMESTAMP}
          🔐 *SuSFS*: ${SUSFS_VERSION}
          
          ———————————————
          📥 [DOWNLOAD](${LINK})
          💬 [JOIN TELEGRAM](https://t.me/vortexgki)
          ———————————————
          _© 2026 VorteX_E-Sport_"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" && echo "✅ Telegram sent!" || echo "❌ Telegram failed"

      - name: 📊 Summary
        if: always()
        run: |
          TOTAL_ZIPS=$(find release_files -name '*.zip' 2>/dev/null | wc -l)
          TOTAL_IMGS=$(find release_files -name '*.img' 2>/dev/null | wc -l)
          TOTAL=$((TOTAL_ZIPS + TOTAL_IMGS))
          
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernels** | \`${LINUX_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SuSFS** | \`${SUSFS_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ZIP Files** | \`${TOTAL_ZIPS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **IMG Files** | \`${TOTAL_IMGS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Assets** | \`${TOTAL}\` files |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Links" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [GitHub Release](https://github.com/Kingfinik98/build-vortex/releases/tag/${RELEASE_TAG})" >> $GITHUB_STEP_SUMMARY
          echo "- 💬 [Telegram Group](https://t.me/vortexgki)" >> $GITHUB_STEP_SUMMARY
