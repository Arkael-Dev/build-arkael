name: Release Build - All GKI (UNIFIED)

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Type'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'

      GOVERNOR_CHOICE:
        description: '🎛️ Governor'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'

      VORTEX_GKI_FILE:
        description: '📁 Vortex GKI File'
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  generate-matrix:
    name: "🔧 Generate Build Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_type: ${{ steps.set-matrix.outputs.release_type }}
      governor_choice: ${{ steps.set-matrix.outputs.governor_choice }}
      total_builds: ${{ steps.set-matrix.outputs.total_builds }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 Generate Dynamic Matrix
        id: set-matrix
        env:
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          echo "=========================================="
          echo "  🔧 MATRIX GENERATOR v2.0"
          echo "=========================================="
          
          RELEASE_TYPE=$(echo "${RELEASE_TYPE}" | tr -d '[:space:]')
          GOVERNOR_CHOICE=$(echo "${GOVERNOR_CHOICE}" | tr -d '[:space:]')
          
          echo "  Release Type : '${RELEASE_TYPE}'"
          echo "  Governor     : '${GOVERNOR_CHOICE}'"
          echo "=========================================="
          
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y jq > /dev/null 2>&1
          
          VARIANTS_JSON='[
            {"kernel_version":"5.10","variant_name":"VNL","ksu":"no","ksu_susfs":"false"},
            {"kernel_version":"5.10","variant_name":"KSU","ksu":"yes","ksu_susfs":"false"},
            {"kernel_version":"5.10","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true"},
            {"kernel_version":"5.10","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true"},
            {"kernel_version":"6.1","variant_name":"VNL","ksu":"no","ksu_susfs":"false"},
            {"kernel_version":"6.1","variant_name":"KSU","ksu":"yes","ksu_susfs":"false"},
            {"kernel_version":"6.1","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true"},
            {"kernel_version":"6.1","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true"},
            {"kernel_version":"6.6","variant_name":"VNL","ksu":"no","ksu_susfs":"false"},
            {"kernel_version":"6.6","variant_name":"KSU","ksu":"yes","ksu_susfs":"false"},
            {"kernel_version":"6.6","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true"},
            {"kernel_version":"6.6","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true"}
          ]'
          
          case "$RELEASE_TYPE" in
            full)   SELECTED=$(echo "$VARIANTS_JSON" | jq '.') && echo "✅ Mode: FULL" ;;
            ksu)    SELECTED=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "yes" or .ksu == "sukisu")]') && echo "✅ Mode: KSU ONLY" ;;
            no)     SELECTED=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "no")]') && echo "✅ Mode: VANILLA ONLY" ;;
            sukisu) SELECTED=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "sukisu")]') && echo "✅ Mode: SUKISU ONLY" ;;
            *)      echo "❌ ERROR: Unknown type '$RELEASE_TYPE'" && exit 1 ;;
          esac
          
          if [ "$SELECTED" = "[]" ] || [ "$SELECTED" = "null" ]; then
            echo "❌ ERROR: No variants selected!"
            exit 1
          fi
          
          if [ "$GOVERNOR_CHOICE" = "all" ]; then
            GOVS='["vortexcore","arkael"]'
          else
            GOVS="[\"${GOVERNOR_CHOICE:-vortexcore}\"]"
          fi
          
          # Generate cross-product matrix
          MATRIX=$(echo "$SELECTED" | jq --argjson govs "$GOVS" '[
            .[] | ($govs[] as $gov | {
              kernel_version: .kernel_version,
              variant_name: .variant_name,
              governor: $gov,
              ksu: .ksu,
              ksu_susfs: .ksu_susfs,
              build_id: "\(.kernel_version)-\(.variant_name)-\($gov)"
            })
          ]')
          
          # Validate JSON
          MATRIX_COMPACT=$(echo "$MATRIX" | jq -c '.' 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$MATRIX_COMPACT" ]; then
            echo "❌ ERROR: Failed to generate valid matrix!"
            exit 1
          fi
          
          TOTAL=$(echo "$MATRIX" | jq 'length')
          
          # ✅ OUTPUT USING HEREDOC (FIX FOR GITHUB ACTIONS)
          {
            echo "matrix<<MATRIX_EOF"
            echo "$MATRIX_COMPACT"
            echo "MATRIX_EOF"
            echo "release_type=${RELEASE_TYPE}"
            echo "governor_choice=${GOVERNOR_CHOICE}"
            echo "total_builds=${TOTAL}"
          } >> $GITHUB_OUTPUT
          
          echo ""
          echo "=========================================="
          echo "  ✅ MATRIX READY"
          echo "=========================================="
          echo "  Total Builds : ${TOTAL}"
          echo "  Format       : VALID JSON ✅"
          echo "=========================================="

  # ============================================
  # PARALLEL BUILD JOB (Fast Execution)
  # ============================================
  build:
    name: "🔨 ${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ matrix.governor }}"
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Environment
        run: |
          echo "BUILD_ID=${{ matrix.build_id }}" >> $GITHUB_ENV
          echo "KERNEL_VER=${{ matrix.kernel_version }}" >> $GITHUB_ENV
          echo "VARIANT=${{ matrix.variant_name }}" >> $GITHUB_ENV
          echo "GOV=${{ matrix.governor }}" >> $GITHUB_ENV
          mkdir -p output

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq python3-pip
          pip install lxml -qq

      - name: 🐧 Build Kernel
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
          GOVERNOR_CHOICE: ${{ matrix.governor }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "▶️ Building: ${{ matrix.build_id }}"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          
          # Run build script
          ./build.sh || {
            echo "❌ Build failed for ${{ matrix.build_id }}"
            exit 1
          }
          
          # Move artifacts to standardized location
          if [ -d "artifacts" ]; then
            find artifacts -type f \( -name "*.zip" -o -name "*.img" \) \
              -exec cp {} output/ \; 2>/dev/null || true
          fi
          
          ls -lh output/ 2>/dev/null || echo "⚠️ No output files"

      - name: 📤 Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "build-${{ matrix.build_id }}"
          path: output/
          retention-days: 1
          if-no-files-found: warn

  # ============================================
  # UNIFIED RELEASE JOB (Single ZIP)
  # ============================================
  release:
    name: "📦 Create Unified Release"
    permissions:
      contents: write
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: always() && needs.generate-matrix.result == 'success'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_builds
          pattern: 'build-*'
          merge-multiple: false

      - name: 🔍 Inspect Downloads
        run: |
          echo "📂 Downloaded structure:"
          find all_builds -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | head -50
          echo ""
          TOTAL_FILES=$(find all_builds -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo "📊 Total files found: ${TOTAL_FILES}"
          echo "total_files=${TOTAL_FILES}" >> $GITHUB_ENV

      - name: 🗃️ Create Unified ZIP Bundle
        if: env.total_files > 0
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          RELEASE_TYPE="${{ needs.generate-matrix.outputs.release_type }}"
          GOV="${{ needs.generate-matrix.outputs.governor_choice }}"
          
          # Create release directory structure
          mkdir -p "Arkael-Kernel-AllGKI-${TIMESTAMP}"
          
          # Copy all files to unified directory
          find all_builds -type f \( -name "*.zip" -o -name "*.img" \) \
            -exec cp {} "Arkael-Kernel-AllGKI-${TIMESTAMP}/" \;
          
          # Create info file
          cat > "Arkael-Kernel-AllGKI-${TIMESTAMP}/README.txt" << EOF
          Arkael Kernel - All GKI Unified Build
          =====================================
          Build Date : ${TIMESTAMP}
          Type       : ${RELEASE_TYPE}
          Governor   : ${GOV}
          Total Files: $(ls -1 "Arkael-Kernel-AllGKI-${TIMESTAMP}/"*.zip "Arkael-Kernel-AllGKI-${TIMESTAMP}/"*.img 2>/dev/null | wc -l)
          
          Contents:
          - GKI 5.10 (Android 12): VNL, KSU, KSU+SuSFS, SukiSU
          - GKI 6.1 (Android 14): VNL, KSU, KSU+SuSFS, SukiSU
          - GKI 6.6 (Android 15): VNL, KSU, KSU+SuSFS, SukiSU
          
          Built by Kingfinik98
          © 2026 Arkael Kernel Project
          EOF
          
          # Create SINGLE ZIP
          zip -r "Arkael-Kernel-AllGKI-${RELEASE_TYPE}-${GOV}-${TIMESTAMP}.zip" \
            "Arkael-Kernel-AllGKI-${TIMAPSHOT}/"
          
          # Set output variables
          echo "ZIP_FILE=Arkael-Kernel-AllGKI-${RELEASE_TYPE}-${GOV}-${TIMESTAMP}.zip" >> $GITHUB_ENV
          echo "RELEASE_TAG=Arkael-Kernel-AllGKI-${RELEASE_TYPE}-${GOV}-${TIMESTAMP}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          
          echo "✅ Created unified ZIP:"
          ls -lh "Arkael-Kernel-AllGKI-"*.zip

      - name: 🚀 Create GitHub Release
        if: env.ZIP_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="Kingfinik98/build-arkael"
          
          # Create release
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 Arkael Kernel - All GKI (${BUILD_TIMESTAMP})" \
            --notes "## 📦 Arkael Kernel - All GKI Unified Release

          ### 📋 Build Info
          | Item | Value |
          |------|-------|
          **Type** | ${{ needs.generate-matrix.outputs.release_type }} |
          **Governor** | ${{ needs.generate-matrix.outputs.governor_choice }} |
          **Total Builds** | ${{ needs.generate-matrix.outputs.total_builds }} |
          **Date** | ${BUILD_TIMESTAMP} |

          ### 📦 Contents
          This ZIP contains ALL kernel variants in one package:
          - **GKI 5.10** (Android 12): VNL, KSU, KSU+SuSFS, SukiSU
          - **GKI 6.1** (Android 14): VNL, KSU, KSU+SuSFS, SukiSU  
          - **GKI 6.6** (Android 15): VNL, KSU, KSU+SuSFS, SukiSU

          ---
          *Built by Kingfinik98* © 2026" || true
          
          # Upload the SINGLE unified ZIP
          gh release upload "${RELEASE_TAG}" \
            --repo "${REPO}" \
            "${ZIP_FILE}" \
            --clobber 2>/dev/null && echo "✅ Uploaded: ${ZIP_FILE}"

      - name: 📬 Telegram Notification
        if: always() && env.RELEASE_TAG != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="*🐧 ARKAEL KERNEL - ALL GKI UNIFIED* ✅
          
          📦 Type: \`${{ needs.generate-matrix.outputs.release_type }}\`
          🎛️ Gov: \`${{ needs.generate-matrix.outputs.governor_choice }}\`
          📊 Builds: \`${{ needs.generate-matrix.outputs.total_builds }}\` variants
          📅 ${BUILD_TIMESTAMP}
          
          🔗 [Download ZIP](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG})
          
          _© 2025-2026 Arkael Kernel_"
          
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}" > /dev/null 2>&1 || true

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | \`${{ needs.generate-matrix.outputs.release_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Governor** | \`${{ needs.generate-matrix.outputs.governor_choice }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Variants** | \`${{ needs.generate-matrix.outputs.total_builds }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Output** | **1 Unified ZIP** ✅ |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${ZIP_FILE}" ]; then
            echo "| **File Size** | $(du -h "${ZIP_FILE}" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Download** | [${ZIP_FILE}](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG}) |" >> $GITHUB_STEP_SUMMARY
          fi
