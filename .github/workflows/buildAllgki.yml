name: Release Build - All GKI (FIXED)

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Type'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'

      GOVERNOR_CHOICE:
        description: '🎛️ Governor'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'

      VORTEX_GKI_FILE:
        description: '📁 Vortex GKI File'
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  generate-matrix:
    name: "🔧 Generate Build Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release_type: ${{ steps.set-matrix.outputs.release_type }}
      governor_choice: ${{ steps.set-matrix.outputs.governor_choice }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 Generate Dynamic Matrix
        id: set-matrix
        env:
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          echo "=========================================="
          echo "  🔧 MATRIX GENERATOR"
          echo "=========================================="
          
          RELEASE_TYPE=$(echo "${RELEASE_TYPE}" | tr -d '[:space:]')
          GOVERNOR_CHOICE=$(echo "${GOVERNOR_CHOICE}" | tr -d '[:space:]')
          
          echo "  Release Type : '${RELEASE_TYPE}'"
          echo "  Governor     : '${GOVERNOR_CHOICE}'"
          echo "=========================================="
          
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y jq > /dev/null 2>&1
          
          VARIANTS_JSON='[
            {"kernel_version":"5.10","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"true"}
          ]'
          
          if [ "$RELEASE_TYPE" = "full" ]; then
            SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq '.')
            echo "✅ Mode: FULL"
          elif [ "$RELEASE_TYPE" = "ksu" ]; then
            SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "yes" or .ksu == "sukisu")]')
            echo "✅ Mode: KSU ONLY"
          elif [ "$RELEASE_TYPE" = "no" ]; then
            SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "no")]')
            echo "✅ Mode: NON-KSU ONLY"
          elif [ "$RELEASE_TYPE" = "sukisu" ]; then
            SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq '[.[] | select(.ksu == "sukisu")]')
            echo "✅ Mode: SUKISU ONLY"
          else
            echo "❌ ERROR: Unknown release type '$RELEASE_TYPE'"
            exit 1
          fi
          
          if [ -z "$SELECTED_VARIANTS" ] || [ "$SELECTED_VARIANTS" = "[]" ] || [ "$SELECTED_VARIANTS" = "null" ]; then
            echo "❌ ERROR: No variants selected"
            exit 1
          fi
          
          if [ "$GOVERNOR_CHOICE" = "all" ]; then
            GOVS='["vortexcore","arkael"]'
          else
            GOVS="[\"${GOVERNOR_CHOICE:-vortexcore}\"]"
          fi
          
          FINAL_MATRIX=$(echo "$SELECTED_VARIANTS" | jq --argjson govs "$GOVS" '[
            .[] | 
            ($govs[] as $gov | {
              kernel_version: .kernel_version,
              variant_name: .variant_name,
              governor: $gov,
              ksu: .ksu,
              ksu_susfs: .ksu_susfs,
              last_build: .last_build
            })
          ]')
          
          # FIX: TRIM WHITESPACE UNTUK GITHUB OUTPUT!
          MATRIX_CLEAN=$(echo "$FINAL_MATRIX" | tr -d '[:space:]')
          echo "matrix=${MATRIX_CLEAN}" >> $GITHUB_OUTPUT
          
          # Output variables for downstream jobs
          echo "release_type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
          echo "governor_choice=${GOVERNOR_CHOICE}" >> $GITHUB_OUTPUT
          
          TOTAL=$(echo "$FINAL_MATRIX" | jq 'length')
          echo ""
          echo "=========================================="
          echo "  📊 MATRIX GENERATED"
          echo "=========================================="
          echo "  Total Builds : ${TOTAL}"
          echo "=========================================="

  build:
    name: "🐧 ${{ matrix.kernel_version }} | ${{ matrix.variant_name }} | ${{ matrix.governor }}"
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Initialize Build Environment
        run: |
          echo "STATUS=RELEASE" >> $GITHUB_ENV
          echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          echo "=========================================="
          echo "  🚀 ARKAEL KERNEL BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel   : ${{ matrix.kernel_version }}"
          echo "  Variant  : ${{ matrix.variant_name }}"
          echo "  Governor : ${{ matrix.governor }}"
          echo "  KSU      : ${{ matrix.ksu }}"
          echo "  SuSFS    : ${{ matrix.ksu_susfs }}"
          echo "=========================================="

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq > /dev/null 2>&1
          pip install lxml > /dev/null 2>&1
          echo "✅ Dependencies installed"

      - name: ⚙️ Execute Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          LAST_BUILD: ${{ matrix.last_build }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
          GOVERNOR_CHOICE: ${{ matrix.governor }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "▶️ BUILD: ${{ matrix.variant_name }} (${{ matrix.kernel_version }}) [Gov: ${{ matrix.governor }}]"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          ./build.sh
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ Build OK!"

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4  # ✅ FIXED: Typo corrected!
        with:
          name: "${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ matrix.governor }}-${{ github.run_number }}"
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          if-no-files-found: warn

  release:
    name: "🚀 Create Unified Release"
    permissions:
      contents: write
    needs: [generate-matrix, build]  # ✅ FIXED: Added generate-matrix dependency
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: 🔍 Inspect & Prepare Artifacts
        run: |
          DEEP_FILES=$(find release_files -mindepth 2 -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          if [ "${DEEP_FILES}" -gt 0 ]; then
            mkdir -p release_flat
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | while read f; do
              cp "$f" release_flat/
            done
            rm -rf release_files
            mv release_flat release_files
          fi
          ls -lh release_files/ 2>/dev/null || echo "⚠️ No files found!"

      - name: 🔍 Extract Build Variables
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=Arkael-Kernel" >> $GITHUB_ENV
            echo "RELEASE=v0.3" >> $GITHUB_ENV
            echo "GOVERNOR=vortexCore" >> $GITHUB_ENV
          fi

      - name: 🏷️ Generate Release Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KERNEL_NAME="${KERNEL_NAME:-Arkael-Kernel}"
          # ✅ FIXED: Use output from generate-matrix job
          GOV_TAG="${GOVERNOR_CHOICE:-${{ needs.generate-matrix.outputs.governor_choice }}}"
          RELEASE_TYPE_TAG="${RELEASE_TYPE:-${{ needs.generate-matrix.outputs.release_type }}}"
          RELEASE_TAG="${KERNEL_NAME}-AllGKI-${RELEASE_TYPE_TAG}-${GOV_TAG}-${TIMESTAMP}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: 📝 Prepare Release Notes
        run: |
          cat > release_notes.md << EOF
          ## 🐧 Arkael Kernel - All GKI Release
          
          ### 📋 Build Information
          | Item | Details |
          |------|---------|
          | **Kernel Name** | ${KERNEL_NAME:-Arkael-Kernel} |
          | **Build Date** | ${BUILD_TIMESTAMP} |
          | **Governor** | ${GOVERNOR_CHOICE:-${{ needs.generate-matrix.outputs.governor_choice }}} |
          
          ### 📦 Variants
          - GKI 5.10 (Android 12): VNL, KSU, KSU+SuSFS, SukiSU
          - GKI 6.1 (Android 14): VNL, KSU, KSU+SuSFS, SukiSU  
          - GKI 6.6 (Android 15): VNL, KSU, KSU+SuSFS, SukiSU
          
          *Built by Kingfinik98*
          EOF

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${REPO:-Kingfinik98/build-arkael}"
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 Arkael Kernel - All GKI (${BUILD_TIMESTAMP})" \
            --notes-file release_notes.md || true
          
          UPLOAD_COUNT=0
          while IFS= read -r f; do
            gh release upload "${RELEASE_TAG}" --repo "${REPO}" "${f}" --clobber 2>/dev/null && ((UPLOAD_COUNT++))
          done < <(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null)
          
          echo "✅ Uploaded ${UPLOAD_COUNT} files"
          echo "🔗 https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

      - name: 📬 Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="*🐧 ARKAEL KERNEL - ALL GKI RELEASE* ✅
          
          📦 Build: ${{ needs.generate-matrix.outputs.release_type }}
          🎛️ Gov: ${{ needs.generate-matrix.outputs.governor_choice }}
          📅 ${BUILD_TIMESTAMP}
          🔗 [Download](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG})"
          _© 2025-2026 Arkael Kernel_"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" -d "parse_mode=markdown" -d "text=${MSG}" > /dev/null 2>&1 || true

      - name: 📊 Summary
        if: always()
        run: |
          TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Total Files | \`${TOTAL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| [View Release](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG}) |" >> $GITHUB_STEP_SUMMARY
