name: Release Build - All GKI

on:
  workflow_dispatch:
    inputs:
      RELEASE_TYPE:
        description: '🎯 Release Type (Build Scope)'
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'ksu'
          - 'no'
          - 'sukisu'

      GOVERNOR_CHOICE:
        description: '🎛️ CPU Governor Selection'
        default: 'vortexcore'
        type: choice
        options:
          - 'vortexcore'
          - 'arkael'
          - 'all'

      VORTEX_GKI_FILE:
        description: '📁 Vortex GKI Source File (Advanced Users)'
        default: 'vortex_gki.c'
        type: string

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  generate-matrix:
    name: "🔧 Generate Build Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 Generate Dynamic Matrix
        id: set-matrix
        env:
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          echo "=========================================="
          echo "  🔧 MATRIX GENERATOR"
          echo "=========================================="
          echo "  Release Type : ${RELEASE_TYPE}"
          echo "  Governor     : ${GOVERNOR_CHOICE}"
          echo "=========================================="
          
          sudo apt-get update && sudo apt-get install -y jq
          
          # Create variants array using heredoc to avoid formatting issues
          read -r -d '' VARIANTS_JSON << 'VARIANTS_EOF'
          [
            {"kernel_version":"5.10","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"5.10","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.1","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"VNL","ksu":"no","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"KSU","ksu":"yes","ksu_susfs":"false","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"KSU+SuSFS","ksu":"yes","ksu_susfs":"true","last_build":"false"},
            {"kernel_version":"6.6","variant_name":"SukiSU","ksu":"sukisu","ksu_susfs":"true","last_build":"true"}
          ]
          VARIANTS_EOF
          
          # Validate JSON before processing
          if ! echo "$VARIANTS_JSON" | jq empty 2>/dev/null; then
            echo "❌ Invalid base JSON!"
            exit 1
          fi
          
          # Filter based on RELEASE_TYPE
          case "${RELEASE_TYPE}" in
            "full")
              SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq -c '.')
              echo "✅ Mode: FULL (All Variants)"
              ;;
            "ksu")
              SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq -c '[.[] | select(.ksu == "yes" or .ksu == "sukisu")]')
              echo "✅ Mode: KSU ONLY"
              ;;
            "no")
              SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq -c '[.[] | select(.ksu == "no")]')
              echo "✅ Mode: NON-KSU"
              ;;
            "sukisu")
              SELECTED_VARIANTS=$(echo "$VARIANTS_JSON" | jq -c '[.[] | select(.ksu == "sukisu")]')
              echo "✅ Mode: SUKISU ONLY"
              ;;
            *)
              echo "❌ Unknown release type: ${RELEASE_TYPE}"
              exit 1
              ;;
          esac
          
          # Validate filtered JSON
          if ! echo "$SELECTED_VARIANTS" | jq empty 2>/dev/null; then
            echo "❌ Invalid filtered JSON!"
            exit 1
          fi
          
          # Determine governors
          case "${GOVERNOR_CHOICE}" in
            "all") GOVS='["vortexcore","arkael"]' ;;
            *) GOVS="[\"${GOVERNOR_CHOICE:-vortexcore}\"]" ;;
          esac
          
          # Generate matrix - use -c for compact output and proper variable handling
          FINAL_MATRIX=$(jq --argjson govs "$GOVS" '
            [
              .[] |
              $govs[] as $gov |
              {
                kernel_version: .kernel_version,
                variant_name: .variant_name,
                governor: $gov,
                ksu: .ksu,
                ksu_susfs: .ksu_susfs,
                last_build: .last_build
              }
            ]
          ' <<< "$SELECTED_VARIANTS")
          
          # Final validation
          if [ -z "$FINAL_MATRIX" ] || ! echo "$FINAL_MATRIX" | jq empty 2>/dev/null; then
            echo "❌ Failed to generate matrix!"
            exit 1
          fi
          
          # Output matrix
          echo "matrix=${FINAL_MATRIX}" >> $GITHUB_OUTPUT
          
          TOTAL_BUILDS=$(echo "$FINAL_MATRIX" | jq 'length')
          echo ""
          echo "=========================================="
          echo "  📊 MATRIX GENERATED"
          echo "=========================================="
          echo "  Total Builds : ${TOTAL_BUILDS}"
          echo "  Release Type : ${RELEASE_TYPE}"
          echo "  Governor(s)  : ${GOVERNOR_CHOICE}"
          echo "=========================================="
          echo ""
          echo "📋 Matrix Preview:"
          echo "$FINAL_MATRIX" | jq '.'

  build:
    name: "🐧 ${{ matrix.kernel_version }} | ${{ matrix.variant_name }} | ${{ matrix.governor }}"
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔍 Initialize Build Environment
        run: |
          echo "STATUS=RELEASE" >> $GITHUB_ENV
          echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          echo "=========================================="
          echo "  🚀 ARKAEL KERNEL BUILD SYSTEM"
          echo "=========================================="
          echo "  Kernel   : ${{ matrix.kernel_version }}"
          echo "  Variant  : ${{ matrix.variant_name }}"
          echo "  Governor : ${{ matrix.governor }}"
          echo "  KSU      : ${{ matrix.ksu }}"
          echo "  SuSFS    : ${{ matrix.ksu_susfs }}"
          echo "  Last Build: ${{ matrix.last_build }}"
          echo "=========================================="

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gh bc bison flex libssl-dev libelf-dev dwarves cpio \
            wget curl git zip unzip p7zip-full jq
          pip install lxml

      - name: ⚙️ Execute Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TODO: "kernel"
          KSU: ${{ matrix.ksu }}
          KSU_SUSFS: ${{ matrix.ksu_susfs }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          LAST_BUILD: ${{ matrix.last_build }}
          KVER: ${{ matrix.kernel_version }}
          STATUS: "RELEASE"
          GOVERNOR_CHOICE: ${{ matrix.governor }}
          VORTEX_GKI_FILE: ${{ inputs.VORTEX_GKI_FILE }}
        run: |
          echo "▶️ BUILD: ${{ matrix.variant_name }} (${{ matrix.kernel_version }}) [Gov: ${{ matrix.governor }}]"
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py 2>/dev/null || true
          ./build.sh
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Failed: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ Build OK!"

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.kernel_version }}-${{ matrix.variant_name }}-${{ matrix.governor }}-${{ github.run_number }}"
          path: |
            artifacts/*.zip
            artifacts/*.img
          retention-days: 30
          if-no-files-found: warn

  release:
    name: "🚀 Create Unified Release"
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          pattern: '*'
          merge-multiple: true

      - name: 🔍 Inspect & Prepare Artifacts
        run: |
          echo "=========================================="
          echo "  🔍 ARTIFACT STRUCTURE INSPECTION"
          echo "=========================================="
          
          echo ""
          echo "📁 Directory tree:"
          find release_files -type f 2>/dev/null | head -30
          
          echo ""
          echo "📊 File count:"
          find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l
          
          DEEP_FILES=$(find release_files -mindepth 2 -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | wc -l)
          echo ""
          echo "📂 Files in subdirectories: ${DEEP_FILES}"
          
          if [ "${DEEP_FILES}" -gt 0 ]; then
            echo ""
            echo "🔧 Flattening artifact structure..."
            mkdir -p release_flat
            
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null | while read f; do
              cp "$f" release_flat/
              echo "  ✓ Copied: $(basename "$f")"
            done
            
            rm -rf release_files
            mv release_flat release_files
          fi
          
          echo ""
          echo "=========================================="
          echo "  ✅ FINAL ARTIFACT LIST"
          echo "=========================================="
          ls -lh release_files/ 2>/dev/null || echo "  ⚠️ No files found!"
          echo "=========================================="

      - name: 🔍 Extract Build Variables
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          INFO_FILE=$(find release_files -name "info.txt" -type f 2>/dev/null | head -1)
          if [[ -f "$INFO_FILE" ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              [[ -n "$key" && -n "$value" ]] && echo "$key=$value" >> $GITHUB_ENV
            done < "$INFO_FILE"
          else
            echo "KERNEL_NAME=Arkael-Kernel" >> $GITHUB_ENV
            echo "RELEASE=v0.3" >> $GITHUB_ENV
            echo "LINUX_VERSION=unknown" >> $GITHUB_ENV
            echo "SUSFS_VERSION=N/A" >> $GITHUB_ENV
            echo "GOVERNOR=vortexcore" >> $GITHUB_ENV
          fi

      - name: 🏷️ Generate Release Tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          KERNEL_NAME="${KERNEL_NAME:-Arkael-Kernel}"
          GOV_TAG="${GOVERNOR_CHOICE:-${GOVERNOR:-vortexcore}}"
          RELEASE_TYPE_TAG="${RELEASE_TYPE:-full}"
          RELEASE_TAG="${KERNEL_NAME}-AllGKI-${RELEASE_TYPE_TAG}-${GOV_TAG}-${TIMESTAMP}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV

      - name: 📝 Prepare Release Notes
        env:
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          case "${RELEASE_TYPE}" in
            "full") SCOPE_DESC="**All Variants** (VNL, KSU, KSU+SuSFS, SukiSU)" ;;
            "ksu") SCOPE_DESC="**KSU Variants Only** (KSU, KSU+SuSFS, SukiSU)" ;;
            "no") SCOPE_DESC="**Non-KSU Variants Only** (VNL/Vanilla)" ;;
            "sukisu") SCOPE_DESC="**SukiSU Variant Only**" ;;
            *) SCOPE_DESC="**Unknown Scope**" ;;
          esac
          
          case "${GOVERNOR_CHOICE}" in
            "all") GOV_DESC="**Both Governors** (VortexCore + Arkael)" ;;
            "arkael") GOV_DESC="**Arkael Governor** (Optimized Performance)" ;;
            "vortexcore"|*) GOV_DESC="**VortexCore Governor** (Balanced Gaming)" ;;
          esac
          
          cat > release_notes.md << EOF
          ## 🐧 Arkael Kernel - All GKI Release
          
          ### 📋 Build Information
          
          | Item | Details |
          |------|---------|
          | **Kernel Name** | ${KERNEL_NAME:-Arkael-Kernel} |
          | **Build Date** | ${BUILD_TIMESTAMP:-$(date +%Y%m%d-%H%M)} |
          | **Release Type** | ${RELEASE_TYPE:-full} (${SCOPE_DESC}) |
          | **Governor** | ${GOV_DESC} |
          | **SuSFS Version** | ${SUSFS_VERSION:-N/A} |
          
          ---
          
          ### 📦 Available Variants
          
          #### 🔵 GKI 5.10 (Android 12/12.1)
          - \`Arkael-*-5.10-VNL-*.zip\` - Vanilla (No Root)
          - \`Arkael-*-5.10-KSU-*.zip\` - Standard KernelSU
          - \`Arkael-*-5.10-KSU+SuSFS-*.zip\` - KernelSU + Hidden Root
          - \`Arkael-*-5.10-SukiSU-*.zip\` - SukiSU-Ultra (KPM Patch)
          
          #### 🟢 GKI 6.1 (Android 14)
          - \`Arkael-*-6.1-VNL-*.zip\` - Vanilla (No Root)
          - \`Arkael-*-6.1-KSU-*.zip\` - Standard KernelSU
          - \`Arkael-*-6.1-KSU+SuSFS-*.zip\` - KernelSU + Hidden Root
          - \`Arkael-*-6.1-SukiSU-*.zip\` - SukiSU-Ultra (KPM Patch)
          
          #### 🟣 GKI 6.6 (Android 15)
          - \`Arkael-*-6.6-VNL-*.zip\` - Vanilla (No Root)
          - \`Arkael-*-6.6-KSU-*.zip\` - Standard KernelSU
          - \`Arkael-*-6.6-KSU+SuSFS-*.zip\` - KernelSU + Hidden Root
          - \`Arkael-*-6.6-SukiSU-*.zip\` - SukiSU-Ultra (KPM Patch)
          
          > 📁 **Naming Format**: \`{KernelName}-{Version}-{Variant}-{Governor}-{Date}.zip\`
          
          ---
          
          ### ⚡ Features
          
          - 🎮 **Custom CPU Governor** - ${GOV_DESC}
          - 🛡️ **Ultra-Safe Kernel Patches** - Optimized for stability
          - 📸 **Camera Fixes** - Infinix GT 20 Pro camera patch (GKI 5.10)
          - 🎮 **GPU Tuning** - Adreno SkiaVK driver included
          - 🔧 **WiFi/BT Fixes** - SM8650 & WCN3988 support (GKI 6.1)
          
          ### 🔐 Root Solutions (3 Variants)
          
          | Variant | KPM Patch | SuSFS Support | Description |
          |---------|-----------|---------------|-------------|
          | **KSU** | ❌ | ✅ Optional | Standard KernelSU-Next |
          | **SukiSU** | ✅ | ✅ Recommended | SukiSU-Ultra KPM-based root |
          | **VNL** | ❌ | ❌ | No root (vanilla) |
          
          ---
          
          ### 📱 Installation
          
          1. Download ZIP file according to your chosen variant & governor
          2. Flash via AnyKernel3 / Recovery / KernelFlash / fkm
          3. Reboot device
          
          > ⚠️ **Backup your data before flashing!**
          
          ---
          
          ### 💬 Support
          
          - 📞 Telegram: [Arkael Kernel](https://t.me/arkaelkernel)
          - 🌐 GitHub: [Kingfinik98/build-arkael](https://github.com/Kingfinik98/build-arkael)
          
          ---
          
          *Built with ❤️ by Kingfinik98*
          *© 2025-2026 Arkael Kernel. All Rights Reserved*
          EOF
          
          echo "✅ Release notes prepared!"

      - name: 📋 List Build Artifacts
        run: |
          echo "=========================================="
          echo "  📦 ARTIFACTS TO UPLOAD"
          echo "=========================================="
          if [ -d "release_files" ]; then
            find release_files -type f \( -name "*.zip" -o -name "*.img" \) | sort | while read f; do
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              echo "  📄 $(basename "$f") ($SIZE)"
            done
            TOTAL=$(find release_files -type f \( -name "*.zip" -o -name "*.img" \) | wc -l)
            echo ""
            echo "  Total files: $TOTAL"
          else
            echo "  ⚠️ No artifacts found!"
          fi
          echo "=========================================="

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${REPO:-Kingfinik98/build-arkael}"
          
          echo "=========================================="
          echo "  🚀 CREATING GITHUB RELEASE"
          echo "=========================================="
          echo "  Repo     : ${REPO}"
          echo "  Tag      : ${RELEASE_TAG}"
          echo "  Timestamp: ${BUILD_TIMESTAMP}"
          echo "=========================================="
          
          gh release create "${RELEASE_TAG}" \
            --repo "${REPO}" \
            --title "🐧 Arkael Kernel - All GKI (${BUILD_TIMESTAMP}) [${RELEASE_TYPE:-full}]" \
            --notes-file release_notes.md \
            || {
              echo "⚠️ Release already exists or creation failed, trying to update..."
              gh release edit "${RELEASE_TAG}" \
                --repo "${REPO}" \
                --title "🐧 Arkael Kernel - All GKI (${BUILD_TIMESTAMP}) [${RELEASE_TYPE:-full}]" \
                --notes-file release_notes.md \
                2>/dev/null || true
            }
          
          echo "✅ Release created/updated!"
          
          UPLOAD_COUNT=0
          FAIL_COUNT=0
          
          echo ""
          echo "📤 Uploading assets..."
          
          if [ -d "release_files" ]; then
            while IFS= read -r f; do
              FILENAME=$(basename "$f")
              FILESIZE=$(ls -lh "$f" | awk '{print $5}')
              
              echo -n "  📤 Uploading ${FILENAME} (${FILESIZE})... "
              
              if gh release upload "${RELEASE_TAG}" \
                --repo "${REPO}" \
                "${f}" \
                --clobber 2>&1; then
                echo "✅ OK"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              else
                echo "❌ FAILED"
                FAIL_COUNT=$((FAIL_COUNT + 1))
              fi
            
            done < <(find release_files -type f \( -name "*.zip" -o -name "*.img" \) 2>/dev/null)
            
          else
            echo "  ⚠️ No release_files directory found!"
          fi
          
          echo ""
          echo "=========================================="
          echo "  📊 UPLOAD SUMMARY"
          echo "=========================================="
          echo "  ✅ Successful: ${UPLOAD_COUNT} files"
          echo "  ❌ Failed:     ${FAIL_COUNT} files"
          echo "=========================================="
          
          if [ "${UPLOAD_COUNT}" -eq 0 ] && [ "${FAIL_COUNT}" -eq 0 ]; then
            echo "⚠️ WARNING: No files were uploaded! Release may be empty."
            exit 1
          fi
          
          echo ""
          echo "✅ Release complete!"
          echo "🔗 https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"

      - name: 📬 Send Telegram Notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          REPO="${REPO:-Kingfinik98/build-arkael}"
          LINK="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          TOTAL_ZIPS=$(find release_files -name "*.zip" 2>/dev/null | wc -l)
          
          case "${RELEASE_TYPE}" in
            "full")   SCOPE_TEXT="All Variants" ;;
            "ksu")    SCOPE_TEXT="KSU Only" ;;
            "no")     SCOPE_TEXT="Vanilla Only" ;;
            "sukisu") SCOPE_TEXT="SukiSU Only" ;;
            *)       SCOPE_TEXT="${RELEASE_TYPE}" ;;
          esac
          
          case "${GOVERNOR_CHOICE}" in
            "all")     GOV_TEXT="VortexCore + Arkael" ;;
            "arkael")  GOV_TEXT="Arkael" ;;
            *)        GOV_TEXT="VortexCore" ;;
          esac
          
          MSG="*🐧 ARKAEL KERNEL - ALL GKI RELEASE* 🚀
          
          ✅ *Status*: SUCCESS
          📦 *Builds*: ${TOTAL_ZIPS} ZIPs
          🐧 *Kernels*: 5.10, 6.1, 6.6
          🎛️ *Governor*: ${GOV_TEXT}
          📋 *Scope*: ${SCOPE_TEXT}
          📅 *Date*: ${BUILD_TIMESTAMP}
          🔐 *Root*: KSU, SukiSU, VNL
          
          ———————————————
          📥 [DOWNLOAD](${LINK})
          ———————————————
          _© 2025-2026 Arkael Kernel_"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}" && echo "✅ Telegram sent!" || echo "❌ Telegram failed"

      - name: 📊 Summary
        if: always()
        env:
          RELEASE_TYPE: ${{ inputs.RELEASE_TYPE }}
          GOVERNOR_CHOICE: ${{ inputs.GOVERNOR_CHOICE }}
        run: |
          TOTAL_ZIPS=$(find release_files -name '*.zip' 2>/dev/null | wc -l)
          TOTAL_IMGS=$(find release_files -name '*.img' 2>/dev/null | wc -l)
          TOTAL=$((TOTAL_ZIPS + TOTAL_IMGS))
          
          case "${RELEASE_TYPE}" in
            "full")   SCOPE_LABEL="Full" ;;
            "ksu")    SCOPE_LABEL="KSU Only" ;;
            "no")     SCOPE_LABEL="Non-KSU" ;;
            "sukisu") SCOPE_LABEL="SukiSU" ;;
            *)       SCOPE_LABEL="${RELEASE_TYPE}" ;;
          esac
          
          case "${GOVERNOR_CHOICE}" in
            "all")     GOV_LABEL="Dual (VC+AK)" ;;
            "arkael")  GOV_LABEL="Arkael" ;;
            *)        GOV_LABEL="VortexCore" ;;
          esac
          
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | \`${SCOPE_LABEL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Governor** | \`${GOV_LABEL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Kernels** | \`5.10\`, \`6.1\`, \`6.6\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ZIP Files** | \`${TOTAL_ZIPS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **IMG Files** | \`${TOTAL_IMGS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Assets** | \`${TOTAL}\` files |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Link" >> $GITHUB_STEP_SUMMARY
          echo "[🔗 View Release](https://github.com/Kingfinik98/build-arkael/releases/tag/${RELEASE_TAG})" >> $GITHUB_STEP_SUMMARY
