name: Mirror gki 6.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Set Git Identity
        run: |
          git config --global user.name "Arkael-Dev"
          git config --global user.email "kingfinix98@gmail.com"

      - name: Clone Source Repository
        run: |
          cd ~
          # Hanya meng-clone branch 6.6 saja (tanpa memuat branch lain)
          # Ganti 'android15-6.6' jika nama branch di repo asli berbeda (misalnya hanya '6.6')
          git clone --branch android15-6.6 --single-branch https://github.com/Arkael-Dev/gki-clo.git gki-clo

      - name: Push Branch to Destination
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}  # <-- DIUBAH: Menggunakan PAT_TOKEN agar bisa push
        run: |
          cd ~/gki-clo

          git remote remove origin || true

          git remote add origin https://x-access-token:${TOKEN}@github.com/Arkael-Dev/kernel-common-android-15.6.6.git

          # Push branch 6.6 ke repo tujuan
          git push -u origin android15-6.6 --force
